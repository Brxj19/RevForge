services:
  postgres:
    image: postgres:16.4-alpine
    container_name: revforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: revforge
      POSTGRES_USER: revforge
      POSTGRES_PASSWORD: revforge
    ports:
      - "5432:5432"
    volumes:
      - revforge-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revforge -d revforge"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: revforge-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    volumes:
      - revforge-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  revforge-postgres-data:
  revforge-redis-data:

