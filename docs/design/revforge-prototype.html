:root{
  --bg:#000;--raised:#060606;--surface:#0b0b0b;--surface-2:#121212;--hover:#181818;--active:#202020;
  --border:#1f1f1f;--border-2:#2c2c2c;
  --text:#ededed;--text-2:#b9b9b9;--muted:#8b8b8b;--subtle:#5f5f5f;
  --accent:#58a6ff;--accent-2:#79c0ff;--accent-bg:rgba(88,166,255,.12);--accent-line:rgba(88,166,255,.4);
  --green:#3fb950;--green-bg:rgba(63,185,80,.12);--amber:#e3b341;--amber-bg:rgba(227,179,65,.12);
  --red:#f85149;--red-bg:rgba(248,81,73,.12);--purple:#bc8cff;--purple-bg:rgba(188,140,255,.12);
  --add-bg:rgba(46,160,67,.15);--add-tx:#aff5b4;--del-bg:rgba(248,81,73,.13);--del-tx:#ffd7d3;
  --display:"Departure Mono","IBM Plex Mono",ui-monospace,monospace;
  --mono:"IBM Plex Mono","SFMono-Regular",Menlo,Consolas,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --top:52px;--side:232px;--r:6px;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--text:#ededed}}
:root[data-theme="dark"]{--bg:#000;--text:#ededed}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
*{scrollbar-width:thin;scrollbar-color:#2a2a2a transparent}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#262626;border-radius:10px;border:3px solid transparent;background-clip:padding-box}::-webkit-scrollbar-thumb:hover{background-color:#3a3a3a}
code,.mono{font-family:var(--mono);font-size:12.5px}
.hash{font-family:var(--display);font-size:12px;letter-spacing:.02em;color:var(--text-2)}
.muted{color:var(--muted)} .subtle{color:var(--subtle)} .link{color:var(--accent)} .link:hover{text-decoration:underline}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);grid-template-rows:var(--top) minmax(0,1fr);height:100%}
.top{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid var(--border);background:var(--bg);z-index:30}
.brand{display:flex;align-items:center;gap:10px;width:calc(var(--side) - 28px);flex-shrink:0}
.brand-mark{width:26px;height:26px;border:1px solid var(--border-2);border-radius:5px;display:grid;place-items:center}
.brand-name{font-family:var(--display);font-size:15px;letter-spacing:.04em}
.org-switch{display:flex;align-items:center;gap:8px;height:32px;padding:0 8px 0 6px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);font-size:13px}
.org-switch:hover{border-color:var(--border-2)}
.org-dot{width:20px;height:20px;border-radius:4px;background:var(--accent-bg);color:var(--accent);display:grid;place-items:center;font:11px var(--display);flex-shrink:0}
.search{flex:1;max-width:560px;display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);color:var(--muted);font-size:13px;text-align:left}
.search:hover{border-color:var(--border-2);color:var(--text-2)}
.search .grow{flex:1}
kbd{font:11px var(--mono);padding:1px 6px;border:1px solid var(--border-2);border-bottom-width:2px;border-radius:4px;color:var(--muted);background:var(--raised);white-space:nowrap}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:6px}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;border:1px solid transparent;border-radius:var(--r);background:none;color:var(--text-2);flex-shrink:0}
.icon-btn:hover{background:var(--hover);color:var(--text)}
.icon-btn.sm{width:28px;height:28px}
.icon-btn.xs{width:24px;height:24px}
.avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#1f6feb,#8957e5);display:inline-grid;place-items:center;font:12px var(--display);color:#fff;border:0;flex-shrink:0}
.avatar.a2{background:linear-gradient(135deg,#238636,#2ea043)}.avatar.a3{background:linear-gradient(135deg,#9e6a03,#d29922)}.avatar.a4{background:linear-gradient(135deg,#da3633,#f85149)}.avatar.a5{background:linear-gradient(135deg,#6e7681,#8b949e)}
.av-stack{display:flex}.av-stack .avatar{border:2px solid var(--bg);margin-left:-8px}.av-stack .avatar:first-child{margin-left:0}
.menu-btn{display:none}

.side{border-right:1px solid var(--border);padding:10px 8px;overflow:auto;display:flex;flex-direction:column;gap:2px;background:var(--bg)}
.nav-a{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:var(--r);color:var(--text-2);font-size:13.5px}
.nav-a:hover{background:var(--hover);color:var(--text)}
.nav-a.on{background:var(--surface-2);color:var(--text);box-shadow:inset 2px 0 0 var(--accent)}
.nav-a .count{margin-left:auto;font:11px var(--mono);color:var(--muted)}
.side h4{margin:16px 10px 6px;font:500 12px var(--sans);color:var(--subtle)}
.pin{display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;border-radius:var(--r);font-size:13px;color:var(--text-2)}
.pin:hover{background:var(--hover)}
.pin i{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.side-foot{margin-top:auto;padding:10px;border-top:1px solid var(--border);font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--green-bg)}

/* main + independent panes */
.main{overflow:auto;min-width:0;min-height:0}
.main.ws{display:flex;flex-direction:column;overflow:hidden}
.ws-body{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px;padding:16px 28px 0}
.panes{flex:1;min-height:0;display:grid;gap:16px}
.pane{min-height:0;min-width:0;overflow:auto;padding-bottom:28px;overscroll-behavior:contain}
.pane.flush{padding-bottom:0;margin-bottom:20px}
.page{max-width:1240px;margin:0 auto;padding:24px 28px 64px}

/* ---------- primitives ---------- */
h1,h2,h3{margin:0;font-weight:500}
.h1{font:22px/1.25 var(--display);letter-spacing:.01em}
.h2{font:600 15px/1.3 var(--sans)}
.h3{font:600 13.5px/1.3 var(--sans)}
.lead{color:var(--muted);margin:6px 0 0;max-width:68ch}
.row{display:flex;align-items:center;gap:8px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stack{display:grid;gap:16px;align-content:start;min-width:0;grid-template-columns:minmax(0,1fr)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:32px;padding:0 12px;border-radius:var(--r);border:1px solid var(--border-2);background:var(--surface-2);font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--active)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#04111f}
.btn.primary:hover:not(:disabled){filter:brightness(1.1);background:var(--accent)}
.btn.ghost{background:none;border-color:transparent;color:var(--text-2)}
.btn.ghost:hover:not(:disabled){background:var(--hover);color:var(--text)}
.btn.danger{color:var(--red);border-color:rgba(248,81,73,.35);background:var(--red-bg)}
.btn.danger-solid{background:var(--red);border-color:var(--red);color:#1a0402}
.btn.sm{height:26px;padding:0 9px;font-size:12px}
.btn.lg{height:38px;padding:0 16px}
.btn .spin{width:13px;height:13px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pill{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:10px;font:500 11.5px var(--sans);border:1px solid var(--border-2);color:var(--text-2);white-space:nowrap}
.pill.green{color:var(--green);border-color:rgba(63,185,80,.3);background:var(--green-bg)}
.pill.blue{color:var(--accent);border-color:var(--accent-line);background:var(--accent-bg)}
.pill.amber{color:var(--amber);border-color:rgba(227,179,65,.3);background:var(--amber-bg)}
.pill.red{color:var(--red);border-color:rgba(248,81,73,.3);background:var(--red-bg)}
.pill.purple{color:var(--purple);border-color:rgba(188,140,255,.3);background:var(--purple-bg)}
.pill .d{width:6px;height:6px;border-radius:50%;background:currentColor}
.ref{display:inline-flex;align-items:center;gap:4px;min-height:20px;padding:0 6px;border-radius:4px;font:11.5px var(--mono);background:var(--surface-2);border:1px solid var(--border-2);color:var(--text-2)}
.card{border:1px solid var(--border);border-radius:8px;background:var(--surface)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border)}
.card-b{padding:16px}
.sticky-h{position:sticky;top:0;z-index:3;background:var(--surface);border-radius:8px 8px 0 0}
.input,.select{height:32px;padding:0 10px;border:1px solid var(--border-2);border-radius:var(--r);background:var(--raised);font-size:13px;min-width:0;width:100%}
.input:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-bg)}
.input.err{border-color:var(--red)}
textarea.input{height:auto;padding:8px 10px;resize:vertical}
.field{display:grid;gap:6px}
.field>label,.field .lbl{font-size:12.5px;font-weight:500;color:var(--text-2)}
.field .hint{font-size:12px;color:var(--muted)}
.field .errt{font-size:12px;color:var(--red)}
.input-wrap{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border:1px solid var(--border-2);border-radius:var(--r);background:var(--raised);color:var(--muted);min-width:0}
.input-wrap input{flex:1;border:0;background:none;outline:none;min-width:0;font-size:13px;color:var(--text)}
.input-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.seg{display:inline-flex;border:1px solid var(--border-2);border-radius:var(--r);padding:2px;background:var(--raised)}
.seg button,.seg a{height:26px;padding:0 10px;border:0;border-radius:4px;background:none;font-size:12.5px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.seg .on{background:var(--active);color:var(--text)}
.seg .n{font:11px var(--mono);color:var(--subtle)}
/* custom select trigger */
.dd{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 8px 0 10px;border:1px solid var(--border-2);border-radius:var(--r);background:var(--raised);font-size:13px;color:var(--text);min-width:0;text-align:left}
.dd:hover{border-color:#3a3a3a}
.dd[aria-expanded="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.dd .v{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd .chev{color:var(--muted);transition:transform .15s}
.dd[aria-expanded="true"] .chev{transform:rotate(180deg)}
.dd.sm{height:28px;font-size:12.5px}
/* switch / checkbox / radio */
.sw{position:relative;width:34px;height:20px;flex-shrink:0}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.sw span{position:absolute;inset:0;border-radius:10px;background:#2a2a2a;transition:.15s;pointer-events:none}
.sw span::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#bbb;transition:.15s}
.sw input:checked+span{background:var(--accent)}
.sw input:checked+span::after{left:17px;background:#fff}
.sw input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.chk{display:flex;align-items:flex-start;gap:10px;font-size:13px;cursor:pointer}
.chk input{appearance:none;width:16px;height:16px;border:1px solid var(--border-2);border-radius:4px;background:var(--raised);margin:2px 0 0;flex-shrink:0;display:grid;place-items:center;cursor:pointer}
.chk input[type=radio]{border-radius:50%}
.chk input:checked{background:var(--accent);border-color:var(--accent)}
.chk input[type=checkbox]:checked::after{content:"";width:8px;height:4px;border:2px solid #04111f;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.chk input[type=radio]:checked::after{content:"";width:6px;height:6px;border-radius:50%;background:#04111f}
.chk small{display:block;color:var(--muted);font-size:12px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 16px;border-bottom:1px solid var(--border)}
.set-row:last-child{border-bottom:0}
.set-row p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
/* tooltip */
[data-tip]{position:relative}
[data-tip]:hover::after,[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#1d1d1d;border:1px solid var(--border-2);color:var(--text);font:500 11.5px var(--sans);padding:4px 8px;border-radius:5px;white-space:nowrap;z-index:70;pointer-events:none}
/* callouts, progress, skeleton */
.callout{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:8px;border:1px solid var(--border-2);background:var(--raised);font-size:13px}
.callout.info{border-color:var(--accent-line);background:var(--accent-bg)} .callout.info svg{color:var(--accent)}
.callout.warn{border-color:rgba(227,179,65,.35);background:var(--amber-bg)} .callout.warn svg{color:var(--amber)}
.callout.err{border-color:rgba(248,81,73,.35);background:var(--red-bg)} .callout.err svg{color:var(--red)}
.callout.ok{border-color:rgba(63,185,80,.35);background:var(--green-bg)} .callout.ok svg{color:var(--green)}
.callout b{font-weight:500}
.callout p{margin:2px 0 0;color:var(--text-2)}
.progress{height:6px;border-radius:3px;background:#1a1a1a;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:3px}
.progress.ind i{width:35%;animation:ind 1.2s ease-in-out infinite}
@keyframes ind{from{transform:translateX(-100%)}to{transform:translateX(300%)}}
.sk{background:linear-gradient(90deg,#121212 25%,#1b1b1b 50%,#121212 75%);background-size:200% 100%;animation:sk 1.4s infinite;border-radius:4px}
@keyframes sk{to{background-position:-200% 0}}

table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{text-align:left;font:500 12px var(--sans);color:var(--muted);padding:8px 16px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface);position:sticky;top:0;z-index:1}
.t th button{border:0;background:none;padding:0;color:inherit;font:inherit;display:inline-flex;align-items:center;gap:4px}
.t th button:hover{color:var(--text)}
.t td{padding:10px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tbody tr:hover{background:var(--raised)}
.t .num{text-align:right;font-family:var(--mono);font-size:12px;color:var(--text-2)}
.scroll-x{overflow-x:auto}
.pager{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-top:1px solid var(--border);font-size:12.5px;color:var(--muted)}
.empty{padding:40px 24px;text-align:center;display:grid;justify-items:center;gap:10px}
.empty .h2{font-family:var(--display);font-weight:400}
.empty p{margin:0;color:var(--muted);max-width:52ch}
.empty .il{margin-bottom:4px}
.empty .ic{width:40px;height:40px;border-radius:10px;border:1px solid var(--border-2);display:grid;place-items:center;color:var(--muted);background:var(--raised)}

/* ---------- popover menus ---------- */
.pop{position:fixed;z-index:95;min-width:220px;max-width:min(360px,calc(100vw - 16px));background:var(--surface);border:1px solid var(--border-2);border-radius:8px;box-shadow:0 16px 40px rgba(0,0,0,.65);padding:4px;display:none;flex-direction:column;max-height:min(440px,calc(100vh - 80px))}
.pop.open{display:flex}
.pop .pop-search{margin:2px 2px 4px;height:30px}
.pop .pop-list{overflow:auto;min-height:0}
.pop .pop-head{padding:8px 10px;border-bottom:1px solid var(--border);margin:-4px -4px 4px;font-size:13px}
.pop .grp{font-size:11.5px;color:var(--subtle);padding:8px 10px 3px;display:flex;justify-content:space-between}
.mi{display:flex;align-items:center;gap:10px;width:100%;min-height:32px;padding:5px 10px;border:0;border-radius:5px;background:none;font-size:13px;color:var(--text-2);text-align:left}
.mi.sel{background:var(--active);color:var(--text)}
.mi .ck{width:14px;color:var(--accent);flex-shrink:0;display:grid}
.mi .tx{flex:1;min-width:0;display:grid}
.mi .tx span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi .tx small{color:var(--muted);font-size:11.5px;white-space:normal}
.mi .k{font:11px var(--mono);color:var(--subtle)}
.mi.danger{color:var(--red)}
.pop hr{border:0;border-top:1px solid var(--border);margin:4px -4px}
.pop .none{padding:14px;text-align:center;color:var(--muted);font-size:12.5px}

/* ---------- dialogs & toasts ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:90;display:none;align-items:flex-start;justify-content:center;padding:10vh 16px 16px}
.scrim.open{display:flex}
.dialog{width:520px;max-width:100%;background:var(--surface);border:1px solid var(--border-2);border-radius:10px;box-shadow:0 24px 60px rgba(0,0,0,.7);max-height:80vh;display:flex;flex-direction:column}
.dialog .dh{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:16px 18px 0}
.dialog .dh p{margin:4px 0 0;color:var(--muted);font-size:13px}
.dialog .db{padding:16px 18px;overflow:auto;display:grid;gap:14px}
.dialog .df{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--border);background:var(--raised);border-radius:0 0 10px 10px}
.toasts{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));right:20px;display:grid;gap:8px;z-index:100;width:min(360px,calc(100vw - 40px))}
.toast{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--border-2);padding:10px 12px;border-radius:8px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:tin .18s ease-out}
.toast .grow{flex:1}
.toast.ok svg:first-child{color:var(--green)} .toast.err svg:first-child{color:var(--red)} .toast.info svg:first-child{color:var(--accent)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}

/* ---------- command palette ---------- */
.pal-box{width:860px;max-width:100%;background:var(--surface);border:1px solid var(--border-2);border-radius:12px;box-shadow:0 24px 70px rgba(0,0,0,.75);overflow:hidden;display:flex;flex-direction:column;max-height:76vh}
.pal-in{display:flex;align-items:center;gap:10px;height:52px;padding:0 14px;border-bottom:1px solid var(--border);color:var(--muted)}
.pal-in input{flex:1;border:0;background:none;outline:none;font-size:15px;color:var(--text);min-width:0}
.mode-chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border-radius:5px;background:var(--accent-bg);border:1px solid var(--accent-line);color:var(--accent);font:500 12px var(--sans);white-space:nowrap}
.mode-chip b{font:600 12px var(--mono)}
.pal-modes{display:flex;gap:4px;padding:8px 10px;border-bottom:1px solid var(--border);overflow-x:auto}
.pal-modes button{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border:1px solid transparent;border-radius:5px;background:none;font-size:12.5px;color:var(--muted);white-space:nowrap}
.pal-modes button b{font:600 12px var(--mono);color:var(--subtle)}
.pal-modes button:hover{background:var(--hover);color:var(--text)}
.pal-modes button.on{background:var(--active);color:var(--text);border-color:var(--border-2)}
.pal-modes button.on b{color:var(--accent)}
.pal-main{display:grid;grid-template-columns:minmax(0,1fr) 330px;min-height:0;flex:1}
.pal-list{overflow:auto;padding:6px;min-height:240px}
.pal-prev{border-left:1px solid var(--border);overflow:auto;padding:16px;background:var(--raised);font-size:13px;display:grid;gap:12px;align-content:start}
.pal-group{font-size:11.5px;color:var(--subtle);padding:10px 10px 4px;display:flex;justify-content:space-between}
.pal-item{display:flex;align-items:center;gap:10px;min-height:40px;padding:4px 10px;border-radius:6px;font-size:13.5px;color:var(--text-2);width:100%;border:0;background:none;text-align:left}
.pal-item.sel{background:var(--active);color:var(--text)}
.pal-item .tx{flex:1;min-width:0;display:grid}
.pal-item .tx span,.pal-item .tx small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal-item .tx small{font-size:12px;color:var(--muted)}
.pal-item mark{background:none;color:var(--accent);font-weight:600}
.pal-item .k{font:11.5px var(--mono);color:var(--subtle);display:flex;gap:4px}
.pal-item .ic{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--border);flex-shrink:0;color:var(--text-2)}
.pal-foot{display:flex;gap:16px;align-items:center;padding:8px 14px;border-top:1px solid var(--border);font-size:12px;color:var(--subtle);flex-wrap:wrap}
.pal-foot .scope{margin-left:auto;font-family:var(--mono)}
.prefix-help{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:4px 4px 8px}
.prefix-help button{display:grid;gap:2px;text-align:left;padding:8px 10px;border:1px solid var(--border);border-radius:6px;background:var(--raised);font-size:12.5px;color:var(--text-2)}
.prefix-help button:hover{border-color:var(--border-2);color:var(--text)}
.prefix-help b{font:600 13px var(--mono);color:var(--accent)}
.prefix-help small{color:var(--muted);font-size:11.5px}
.prev-code{font:11.5px/1.6 var(--mono);background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px 0;overflow:hidden;white-space:pre}
.prev-code div{padding:0 10px;overflow:hidden;text-overflow:ellipsis}
.prev-code .hit{background:var(--accent-bg)}
.prev-code .ln{color:var(--subtle);display:inline-block;width:22px;text-align:right;margin-right:10px}

/* ---------- dashboard ---------- */
.greet{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.recent{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.repo-tile{padding:14px 16px;display:grid;gap:8px}
.repo-tile:hover{border-color:var(--border-2);background:var(--raised)}
.repo-tile .name{font-family:var(--display);font-size:14px}
.repo-tile p{margin:0;color:var(--muted);font-size:12.5px;min-height:36px}
.spark-wrap{display:grid;justify-items:end;gap:1px}
.spark-wrap small{font:10.5px var(--mono);color:var(--subtle);white-space:nowrap}
.feed-i{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);align-items:start}
.feed-i:last-child{border-bottom:0}
.feed-ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--border-2);color:var(--text-2)}
.feed-i .what{font-size:13px}
.feed-i .what b{font-weight:500}
.feed-i .msg{font-size:12.5px;color:var(--muted);margin-top:2px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,10px);gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:10px;height:10px;border-radius:2px;background:#141414}
.heat i[data-l="1"]{background:color-mix(in srgb,var(--accent) 22%,#0b0b0b)} .heat i[data-l="2"]{background:color-mix(in srgb,var(--accent) 42%,#0b0b0b)}
.heat i[data-l="3"]{background:color-mix(in srgb,var(--accent) 65%,#0b0b0b)} .heat i[data-l="4"]{background:var(--accent)}
.attn a{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:12px 16px;border-bottom:1px solid var(--border)}
.attn a:last-child{border-bottom:0}
.attn a:hover{background:var(--raised)}
.attn small{display:block;color:var(--muted);font-size:12px}

/* ---------- repository ---------- */
.repo-head{flex:none;padding:16px 28px 0;border-bottom:1px solid var(--border);background:var(--bg)}
.repo-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.repo-title .crumb{font-family:var(--display);font-size:20px;color:var(--muted)}
.repo-title .crumb b{color:var(--text);font-weight:400}
.repo-desc{color:var(--muted);margin:4px 0 0;font-size:13.5px}
.tabs{display:flex;gap:2px;margin-top:10px;overflow-x:auto}
.tabs a,.tabs button{position:relative;display:flex;align-items:center;gap:7px;height:38px;padding:0 12px;color:var(--muted);font-size:13.5px;white-space:nowrap;border:0;background:none}
.tabs a:hover,.tabs button:hover{color:var(--text)}
.tabs .on{color:var(--text)}
.tabs .on::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;background:var(--accent);border-radius:2px}
.tabs .n{font:11px var(--mono);color:var(--subtle);padding:0 5px;border-radius:8px;background:var(--surface-2)}
.tabs.boxed{border-bottom:1px solid var(--border);margin-top:0}

.rail{flex:none;display:flex;align-items:center;height:40px;border:1px solid var(--border);border-radius:8px;background:var(--raised);font-family:var(--mono);font-size:12.5px;overflow:hidden}
.rail > *{display:flex;align-items:center;gap:7px;height:100%;padding:0 12px;border:0;border-right:1px solid var(--border);white-space:nowrap;background:none}
.rail button:hover{background:var(--hover)}
.rail .rev{color:var(--accent)}
.rail .path{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;gap:4px;color:var(--text-2)}
.rail .path a{color:var(--text-2)}
.rail .path a:hover{color:var(--text);text-decoration:underline}
.rail .path b{font-weight:500;color:var(--text)}
.rail .sep{color:var(--subtle)}
.rail > :last-child{border-right:0}
.rail .tool{color:var(--muted);font-family:var(--sans);font-size:12.5px}
.rail .tool:hover{color:var(--text)}

.f-name{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:13px}
.f-name:hover{color:var(--accent-2)}
.f-msg{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:0;width:100%}
.f-msg a:hover{color:var(--text);text-decoration:underline}
.f-age{color:var(--muted);text-align:right;white-space:nowrap;font-size:12.5px}
.files .t td{padding:8px 16px}
.files .t td:first-child{width:34%}
.latest{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);font-size:13px}
.readme{padding:20px 24px;line-height:1.65}
.readme h1{font:20px var(--display);margin:0 0 12px}
.facts div{display:flex;justify-content:space-between;gap:10px;padding:9px 16px;border-bottom:1px solid var(--border);font-size:13px}
.facts div:last-child{border-bottom:0}
.facts dt{color:var(--muted)} .facts dd{margin:0;text-align:right}
.lang{display:flex;height:6px;border-radius:3px;overflow:hidden;margin:4px 16px 12px}
.clone-pop{position:absolute;right:0;top:calc(100% + 6px);width:420px;max-width:calc(100vw - 32px);z-index:40;box-shadow:0 18px 40px rgba(0,0,0,.6)}
.copyline{display:flex;align-items:center;gap:6px;border:1px solid var(--border-2);border-radius:var(--r);background:var(--raised);padding:0 4px 0 10px;height:34px;min-width:0}
.copyline code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-2)}
.copy-btn.done{color:var(--green)}

/* explorer */
.explorer{display:flex;flex-direction:column;padding:0}
.ex-h{display:flex;align-items:center;gap:4px;padding:8px 8px 8px 12px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:2;border-radius:8px 8px 0 0}
.ex-h .t{font:600 12px var(--sans);color:var(--muted);flex:1}
.ex-filter{padding:8px;border-bottom:1px solid var(--border)}
.ex-tree{padding:6px 4px 12px;font:13px var(--mono)}
.tn{display:flex;align-items:center;gap:6px;height:26px;padding-right:8px;border-radius:4px;color:var(--text-2);cursor:pointer;white-space:nowrap;user-select:none;position:relative}
.tn:hover{background:var(--hover)}
.tn.on{background:var(--accent-bg);color:var(--text)}
.tn.on::before{content:"";position:absolute;left:0;top:3px;bottom:3px;width:2px;border-radius:2px;background:var(--accent)}
.tn:focus-visible{outline:1px solid var(--accent);outline-offset:-1px}
.tn .tw{width:16px;height:16px;display:grid;place-items:center;color:var(--subtle);flex-shrink:0;transition:transform .12s}
.tn .tw.open{transform:rotate(90deg)}
.tn .nm{overflow:hidden;text-overflow:ellipsis}
.tn .nm mark{background:none;color:var(--accent);font-weight:600}
.tn .st{margin-left:auto;font:600 10.5px var(--mono)}
.kids{position:relative}
.kids::before{content:"";position:absolute;top:0;bottom:0;left:var(--guide);border-left:1px solid #1d1d1d}
.ex-tree:hover .kids::before{border-left-color:#2a2a2a}
.fi{width:16px;height:16px;flex-shrink:0;display:block}
.viewer-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px 8px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.viewer-h .meta{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.lastc{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--border);font-size:12.5px;color:var(--muted);background:var(--raised)}
.code{font:13px/1.65 var(--mono);overflow-x:auto}
.code table{border-collapse:collapse;width:100%}
.code td{padding:0 16px;white-space:pre;vertical-align:top}
.code td.ln{width:1%;text-align:right;color:var(--subtle);user-select:none;padding:0 12px 0 16px;border-right:1px solid var(--border);cursor:pointer}
.code tr:hover td{background:#0f0f0f}
.code tr.hl td{background:var(--accent-bg)}
.tk-k{color:#ff7b72}.tk-s{color:#a5d6ff}.tk-c{color:#6e7681}.tk-n{color:#79c0ff}.tk-p{color:#d2a8ff}.tk-f{color:#d2a8ff}

/* blame */
.blame{font:13px/1.65 var(--mono);overflow-x:auto}
.blame table{border-collapse:collapse;width:100%}
.blame tbody+tbody{border-top:1px solid var(--border)}
.blame td{padding:0 16px 0 12px;white-space:pre;vertical-align:top}
.blame td.age{width:3px;padding:0}
.blame td.bi{width:330px;min-width:330px;max-width:330px;padding:0 10px;border-right:1px solid var(--border);font-family:var(--sans);font-size:12px;color:var(--muted);white-space:nowrap;background:var(--surface)}
.blame td.ln{width:1%;text-align:right;color:var(--subtle);user-select:none;padding:0 12px 0 10px;border-right:1px solid var(--border)}
.blame tbody:hover td{background:#0f0f0f}
.blame tbody:hover td.bi{background:var(--raised);color:var(--text-2)}
.blame tbody.pick td{background:var(--accent-bg)}
.bi-in{display:flex;align-items:center;gap:8px;height:21px}
.bi-in .msg{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;color:var(--text-2)}
.bi-in .msg:hover{color:var(--text);text-decoration:underline}
.bi-in .when{font-size:11.5px;color:var(--subtle)}
.bi-in .prior{opacity:0;border:0;background:none;color:var(--muted);width:20px;height:20px;display:grid;place-items:center;border-radius:4px}
.blame tbody:hover .prior,.bi-in .prior:focus-visible{opacity:1}
.bi-in .prior:hover{background:var(--active);color:var(--text)}
.age-scale{display:inline-flex;gap:2px;vertical-align:middle}.age-scale i{width:10px;height:6px;border-radius:1px}
/* heatmap */
.heat-wrap{display:flex;gap:6px;align-items:flex-start}
.heat-days{display:grid;grid-template-rows:19px repeat(7,10px);gap:3px;font-size:10px;line-height:10px;color:var(--subtle);flex-shrink:0}
.heat-scroll{overflow-x:auto;padding-bottom:4px;min-width:0}
.heat-months{position:relative;height:16px;margin-bottom:3px;font-size:10.5px;color:var(--muted)}
.heat-months span{position:absolute;top:0;white-space:nowrap}
.heat:focus-visible{outline:1px solid var(--accent);outline-offset:3px}
#heat i{cursor:pointer}
#heat i:hover,#heat i.act{outline:1px solid var(--text);outline-offset:-1px}
#heat i.pin{outline:2px solid var(--accent);outline-offset:-1px}
#heat i.fut{visibility:hidden}
.htip{position:fixed;z-index:85;background:#1b1b1b;border:1px solid var(--border-2);border-radius:7px;padding:9px 11px;font-size:12px;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.6);min-width:200px;display:none}
.htip b{font-weight:600;font-size:12.5px}
.htip .r{display:flex;align-items:center;gap:7px;color:var(--text-2);margin-top:3px}
.htip .r i{width:7px;height:7px;border-radius:50%}
.htip .r span:last-child{margin-left:auto;font-family:var(--mono);font-size:11.5px}
.heat-stats{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:12px;font-size:12.5px;color:var(--muted)}
.heat-stats b{color:var(--text);font-weight:500}
.day-panel{margin-top:12px;border:1px solid var(--border);border-radius:8px;background:var(--raised);padding:10px 12px;font-size:13px}

/* commit hover card (VS Code style) */
.hcard{position:fixed;z-index:86;width:440px;max-width:calc(100vw - 16px);background:#141414;border:1px solid var(--border-2);border-radius:8px;box-shadow:0 18px 44px rgba(0,0,0,.7);font-size:13px;display:none;overflow:hidden}
.hcard.show{display:block;animation:hcin .12s ease-out}
@keyframes hcin{from{opacity:0;transform:translateY(-3px)}}
.hc-sec{padding:10px 14px;border-bottom:1px solid var(--border)}
.hc-sec:last-child{border-bottom:0}
.hc-who{display:flex;align-items:center;gap:10px}
.hc-who .nm{font-weight:600}
.hc-who .em{color:var(--accent);font-size:12.5px}
.hc-who .tm{color:var(--muted);font-size:12px}
.hc-title{font-weight:600;line-height:1.4}
.hc-body{white-space:pre-wrap;color:var(--text-2);margin-top:6px;line-height:1.5;font-size:12.5px}
.hc-stats{font-size:12.5px;color:var(--text-2)}
.hc-files{display:grid;gap:1px;margin-top:6px;font:12px var(--mono)}
.hc-files div{display:flex;align-items:center;gap:7px;color:var(--text-2)}
.hc-files .grow{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hc-acts{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;font-size:12.5px;background:var(--raised)}
.hc-acts a,.hc-acts button{color:var(--accent);background:none;border:0;padding:2px 0;display:inline-flex;align-items:center;gap:5px;font-size:12.5px}
.hc-acts a:hover,.hc-acts button:hover{text-decoration:underline}
.hc-acts .sep{color:var(--border-2)}

/* icon browser */
.ic-tile{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:none;text-align:left;color:var(--text-2);min-width:0}
.ic-tile:hover{border-color:var(--border-2);background:var(--raised);color:var(--text)}
.ic-tile .fi{width:18px;height:18px}
.ic-tile .tx{display:grid;min-width:0;font:12px var(--mono)}
.ic-tile .tx span,.ic-tile .tx small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ic-tile .tx small{font:11px var(--sans);color:var(--subtle)}
/* illustration kit page */
.ill-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.ill-card{display:flex;flex-direction:column;overflow:hidden}
.ill-art{display:grid;place-items:center;padding:22px 10px 14px;background:var(--bg);border:0;border-bottom:1px solid var(--border);border-radius:8px 8px 0 0;cursor:zoom-in}
.ill-art:hover{background:#050505}
.ill-meta{padding:12px 14px;display:grid;gap:6px}
.ill-meta p{margin:0;color:var(--muted);font-size:12px}

/* history */
.hist-tools{flex:none;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cs-list{position:relative}
.cs-row{display:grid;grid-template-columns:var(--gw,72px) minmax(0,1fr) auto;align-items:center;height:56px;border-bottom:1px solid var(--border);cursor:pointer}
.cs-row:last-child{border-bottom:0}
.cs-row:hover{background:var(--raised)}
.cs-row.on{background:var(--accent-bg)}
.cs-main{min-width:0;padding-right:12px}
.cs-msg{font-size:13.5px;overflow:hidden;white-space:nowrap;display:flex;align-items:center;gap:8px}
.cs-msg span.t{overflow:hidden;text-overflow:ellipsis}
.cs-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap}
.cs-side{display:flex;align-items:center;gap:14px;padding-right:12px;font-size:12px;color:var(--muted)}
.cs-side .stat{font-family:var(--mono);font-size:11.5px}
.add{color:var(--green)} .del{color:var(--red)}
.graph-svg{position:absolute;left:0;top:0;pointer-events:none}
.kv{display:grid;grid-template-columns:90px 1fr;gap:8px 12px;font-size:13px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.chg{display:grid;gap:2px}
.chg a{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:5px;font:12.5px var(--mono)}
.chg a:hover,.chg a.on{background:var(--hover)}
.st-b{width:16px;height:16px;border-radius:3px;display:grid;place-items:center;font:600 10px var(--mono);flex-shrink:0}
.st-b.M{background:var(--amber-bg);color:var(--amber)} .st-b.A{background:var(--green-bg);color:var(--green)} .st-b.R{background:var(--red-bg);color:var(--red)}
.chg .grow{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cs-head{padding:16px 20px;display:grid;gap:10px}
.cs-head .title{font:18px/1.35 var(--display)}
.diff-file{margin-bottom:16px}
.diff-file .card-h{background:var(--raised);font:12.5px var(--mono);padding:8px 12px;position:sticky;top:0;z-index:2;border-radius:8px 8px 0 0}
.diff{font:12.5px/1.6 var(--mono);overflow-x:auto}
.diff table{border-collapse:collapse;width:100%}
.diff td{padding:0 10px;white-space:pre}
.diff td.ln{width:1%;text-align:right;color:var(--subtle);user-select:none;padding:0 8px}
.diff tr.a td{background:var(--add-bg)} .diff tr.a td.c{color:var(--add-tx)}
.diff tr.d td{background:var(--del-bg)} .diff tr.d td.c{color:var(--del-tx)}
.diff tr.h td{background:var(--accent-bg);color:var(--accent-2)}
.bar{display:inline-flex;gap:1px;vertical-align:middle}
.bar i{width:7px;height:7px;border-radius:1px;background:var(--border-2)}
.bar i.a{background:var(--green)} .bar i.d{background:var(--red)}

/* settings */
.subnav{display:grid;gap:2px;align-content:start}
.subnav a,.subnav button{height:32px;display:flex;align-items:center;gap:8px;padding:0 10px;border-radius:var(--r);color:var(--text-2);font-size:13px;border:0;background:none;text-align:left}
.subnav a:hover,.subnav button:hover{background:var(--hover)}
.subnav .on{background:var(--surface-2);color:var(--text)}
.subnav .dz{color:var(--red)}
.subnav h4{font:500 12px var(--sans);color:var(--subtle);margin:14px 10px 4px}
.form{display:grid;gap:16px;max-width:560px}
.form-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--border);background:var(--raised);border-radius:0 0 8px 8px}
.danger-card{border-color:rgba(248,81,73,.35)}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.pal{padding:12px;border:1px solid var(--border-2);border-radius:8px;background:var(--raised);text-align:left;display:grid;gap:8px}
.pal.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.pal .swc{display:flex;gap:4px}.pal .swc i{width:20px;height:20px;border-radius:4px}

/* kit */
.kit-sec{scroll-margin-top:12px}
.kit-sec + .kit-sec{margin-top:20px}
.kit-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.kit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.kit-label{font-size:12px;color:var(--subtle);margin:14px 0 8px}
.kit-label:first-child{margin-top:0}
.icon-gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.icon-gal div{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font:12px var(--mono);color:var(--text-2)}

/* auth + landing + docs */
.auth{min-height:100%;display:grid;place-items:center;padding:24px}
.auth .card{width:380px;max-width:100%}
.land{max-width:1080px;margin:0 auto;padding:56px 28px}
.land h1{font:44px/1.08 var(--display);margin:0;max-width:16ch}
.land .lead{font-size:16px;margin-top:16px}
.term{font:13px/1.8 var(--mono);padding:16px 18px}
.term .p{color:var(--subtle)}
.land-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:center}
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-top:56px}
.feat div{background:var(--bg);padding:18px}
.feat h3{font:500 14px var(--sans);margin:0 0 6px}
.feat p{margin:0;color:var(--muted);font-size:13px}
.prose{max-width:72ch;line-height:1.7}
.prose h1{font:26px var(--display);margin:0 0 8px}
.prose h2{font:600 16px var(--sans);margin:28px 0 8px}
.prose p{color:var(--text-2)}
.prose pre{background:var(--raised);border:1px solid var(--border);border-radius:6px;padding:12px 14px;font:12.5px/1.7 var(--mono);overflow:auto}
.toc a{display:block;font-size:12.5px;color:var(--muted);padding:3px 0}
.docs-nav a{display:block;padding:5px 10px;border-radius:5px;color:var(--text-2);font-size:13px}
.docs-nav a.on{background:var(--surface-2);color:var(--text)}
.docs-nav h4{font:500 12px var(--sans);color:var(--subtle);margin:16px 10px 4px}

/* responsive */
@media (max-width:1100px){
  .pal-main{grid-template-columns:minmax(0,1fr)} .pal-prev{display:none}
  .prefix-help{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;top:var(--top);bottom:0;left:0;width:260px;z-index:45;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none;box-shadow:20px 0 40px rgba(0,0,0,.6)}
  .menu-btn{display:grid}
  .brand{width:auto}
  .org-switch,.brand-name,.search .grow,.search kbd,.top-actions .grow-txt{display:none}
  .search{max-width:none}
  .page{padding:18px 16px 56px}
  .main.ws{display:block;overflow:auto}
  .ws-body{padding:14px 16px 40px;display:block}
  .ws-body>*+*{margin-top:14px}
  .panes{display:block!important}
  .pane{overflow:visible;padding-bottom:0}
  .pane+.pane{margin-top:16px}
  .pane.collapse-m{max-height:300px;overflow:auto}
  .repo-head{padding:14px 16px 0}
  .land-grid{grid-template-columns:1fr}
  .subnav{display:flex;overflow-x:auto}.subnav h4{display:none}
  .subnav a,.subnav button{white-space:nowrap}
  .cs-side .who,.cs-side .stat,.cs-msg .ref{display:none}
  .feat{grid-template-columns:1fr}
  .land h1{font-size:32px}
  .rail .tool span{display:none}
  .f-msg{display:none}
  .prefix-help{grid-template-columns:1fr}
  .hide-m{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open navigation">__I_menu__</button>
    <a class="brand" href="#/">
      <span class="brand-mark">__I_logo__</span>
      <span class="brand-name">RevForge</span>
    </a>
    <button class="org-switch" data-menu="org" aria-haspopup="menu" aria-expanded="false"><span class="org-dot">S</span>sigma<span class="subtle">__I_chev__</span></button>
    <button class="search" id="searchBtn" aria-label="Search or run a command">__I_search__<span class="grow">Search or jump to…  <span class="subtle">try &gt; @ : ~ # /</span></span><kbd>⌘K</kbd></button>
    <div class="top-actions">
      <button class="btn ghost" data-menu="new" aria-haspopup="menu" aria-expanded="false">__I_plus__<span class="grow-txt">New</span></button>
      <a class="icon-btn" href="#/docs" data-tip="Developer docs" aria-label="Developer docs">__I_book__</a>
      <button class="avatar" data-menu="user" aria-haspopup="menu" aria-expanded="false" aria-label="Account menu">B</button>
    </div>
  </header>
  <nav class="side" id="side" aria-label="Primary"></nav>
  <main class="main" id="main" tabindex="-1"></main>
</div>

<div class="pop" id="pop" role="menu"></div>
<div class="scrim" id="dlg" role="dialog" aria-modal="true"></div>
<div class="scrim" id="palette" role="dialog" aria-modal="true" aria-label="Command palette">
  <div class="pal-box">
    <div class="pal-in">__I_search__<span id="palChip"></span><input id="palInput" placeholder="Search everything, or type a prefix" autocomplete="off" spellcheck="false"><kbd>esc</kbd></div>
    <div class="pal-modes" id="palModes"></div>
    <div class="pal-main"><div class="pal-list" id="palList" role="listbox"></div><div class="pal-prev" id="palPrev"></div></div>
    <div class="pal-foot"><span><kbd>↑</kbd> <kbd>↓</kbd> move</span><span><kbd>↵</kbd> open</span><span><kbd>tab</kbd> next mode</span><span><kbd>⌫</kbd> clear mode</span><span class="scope" id="palScope"></span></div>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="htip" id="htip" role="tooltip"></div>
<div class="hcard" id="hcard" role="tooltip"></div>

<script>
/* ===================== icons ===================== */
const P={
  menu:'<path d="M3 6h18M3 12h18M3 18h18"/>',
  logo:'<circle cx="6" cy="6" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="12" cy="18" r="2"/><path d="M6 8v2a4 4 0 0 0 4 4M18 8v2a4 4 0 0 1-4 4M12 14v2"/>',

  repo:'<path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/>',
  review:'<path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/>',
  pulse:'<path d="M3 12h4l3-7 4 14 3-7h4"/>',
  org:'<rect x="4" y="3" width="16" height="18" rx="1"/><path d="M9 7h1M14 7h1M9 11h1M14 11h1M9 15h1M14 15h1"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
  folder:'<path d="M3 6a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/>',
  file:'<path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5"/>',
  branch:'<circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="7" r="2"/><path d="M6 7v10M18 9a6 6 0 0 1-6 6H6"/>',
  commit:'<circle cx="12" cy="12" r="3.5"/><path d="M3 12h5.5M15.5 12H21"/>',
  tag:'<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.2"/>',
  bookmark:'<path d="M6 3h12v18l-6-4-6 4z"/>',
  copy:'<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/>',
  link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
  down:'<path d="M12 4v12M6 11l6 6 6-6M5 20h14"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  key:'<circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M17 6l3 3M14 9l2 2"/>',
  lock:'<rect x="5" y="11" width="14" height="10" rx="1"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20a7 7 0 0 1 14 0M16 4.5a3.5 3.5 0 0 1 0 7M22 20a7 7 0 0 0-4-6.3"/>',
  warn:'<path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17v.5"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/>',
  check:'<path d="m5 12 5 5 9-10"/>',
  push:'<path d="M12 20V6M6 11l6-6 6 6"/>', pull:'<path d="M12 4v14M6 13l6 6 6-6"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>',
  hook:'<path d="M18 16.5a4 4 0 1 1-5.5-3.7L9 7"/><circle cx="7.5" cy="5" r="2.5"/><path d="M6 17h6"/><circle cx="4" cy="17" r="2"/>',
  terminal:'<path d="m5 7 5 5-5 5M12 18h7"/>',

const SHAPES={hex:'M8 1.2 14 4.6v6.8L8 14.8 2 11.4V4.6z',dia:'M8 .8 15.2 8 8 15.2.8 8z',sh:'M8 1.2l5.6 2v4.2c0 3.6-2.6 5.8-5.6 7.2c-3-1.4-5.6-3.6-5.6-7.2V3.2z',tri:'M8 1.5 14.9 14H1.1z'};
function lum(hex){const n=parseInt(hex.slice(1),16);const r=n>>16&255,g=n>>8&255,b=n&255;return (r*299+g*587+b*114)/1000}
function letter(t,col,y=11.2,shrink=1){const len=[...t].length;const fs=(len<=1?8.6:len===2?6.8:len===3?5.2:4.3)*shrink;return `<text x="8" y="${y}" text-anchor="middle" font-family="IBM Plex Mono,ui-monospace,monospace" font-weight="700" font-size="${fs}" fill="${col}">${esc(t)}</text>`}
function drawFile(v){
  const ink=lum(v.c)>150?'#141414':'#ffffff';
  switch(v.k){
    case 'hex':case 'dia':case 'sh':return `<path d="${SHAPES[v.k]}" fill="${v.c}"/>${letter(v.t,ink,v.k==='sh'?10.4:11)}`;
    case 'tri':return `<path d="${SHAPES.tri}" fill="${v.c}"/>${v.t?letter(v.t,ink,12.4,.8):''}`;
    case 'sq':return `<rect x="1.5" y="1.5" width="13" height="13" rx="2.2" fill="${v.c}"/>${letter(v.t,ink,[...v.t].length>2?10.2:11.6)}`;
    case 'ci':return `<circle cx="8" cy="8" r="6.6" fill="${v.c}"/>${letter(v.t,ink,10.9)}`;
    case 'doc':return `<path d="M3.5 1.5h6l3 3v10h-9z" fill="${v.c}"/><path d="M9.5 1.5v3h3" fill="#000" fill-opacity=".25"/>${letter(v.t,ink,12,.82)}`;
    case 'txt':return letter(v.t,v.c,11.2);
    case 'g':return emblem(v.t,8,8,1.95,v.c,1.7);
  }
  return '';
}
function fileIconDef(name){
  const n=(name||'').toLowerCase();if(FILE_EXACT[n])return FILE_EXACT[n];
  for(const [suf,v] of FILE_SUFFIX)if(n.endsWith(suf))return v;
  const ext=n.includes('.')?n.split('.').pop():'';if(ext&&FILE_EXT[ext])return FILE_EXT[ext];
  if(!ext&&!n.startsWith('.'))return {k:'g',c:'#78909c',t:'binary',cat:'Archives & binaries'};
  return null;
}
function fileIcon(name){
  const v=fileIconDef(name);
  const inner=v?drawFile(v):`<path d="M3.5 1.5h6l3 3v10h-9z" fill="#90a4ae"/><path d="M9.5 1.5v3h3" fill="#000" fill-opacity=".25"/>`;
  return `<svg class="fi" viewBox="0 0 16 16" aria-hidden="true">${inner}</svg>`;
}
// Catalogue for the UI kit: one representative name per definition
function iconCatalogue(){
  const files=FILE_DEFS.map(d=>{const tok=d[0].split(' ')[0];const sample=tok.startsWith('=')?tok.slice(1):tok.startsWith('*')?'file'+tok.slice(1):'file.'+tok;
    return {kind:'file',name:sample,label:d[0].split(' ').map(t=>t.replace(/^=/,'').replace(/^\*/,'')).join(' '),cat:d[4]}});
  const folders=FOLDER_DEFS.map(d=>({kind:'folder',name:d[0].split(' ')[0],label:d[0],cat:d[3]}));
  return {files,folders};
}

Graph::Graph(int n) : adj_(n) {}

void Graph::add_edge(int u, int v) {
    adj_[u].push_back(v);

bool Graph::has_edge(int u, int v) const {
    for (int w : adj_[u]) if (w == v) return true;
    return false;
}`,
'src/binary_tree.cpp':`// BinaryTree implementation
#include "binary_tree.hpp"
#include <iostream>

void BinaryTree::insert(int value) {
    Node** cur = &root_;
    while (*cur) cur = value < (*cur)->value ? &(*cur)->left : &(*cur)->right;
    *cur = new Node{value};
}

bool BinaryTree::contains(int value) const {
    Node* cur = root_;
    while (cur) {
        if (value == cur->value) return true;
        cur = value < cur->value ? cur->left : cur->right;
    }
    return false;
}`,

// Empty-state block: illustration + title + body + actions
function es(id,{title,body,actions='',size=160,pad}={}){const a=ART[id];return `<div class="empty" ${pad?`style="padding:${pad}"`:''}>${il(id,size)}<div class="h2">${title??a.title}</div><p>${body??a.body}</p>${actions?`<div class="row" style="flex-wrap:wrap;justify-content:center">${actions}</div>`:''}</div>`}
// Standalone SVG with inlined styles and gradients, for "Copy SVG"
function ilStandalone(id){
  const cs_=getComputedStyle(document.documentElement);const v=n=>cs_.getPropertyValue(n).trim();
  const css=IL_CSS.replace(/var\(--accent\)/g,v('--accent')).replace(/var\(--green\)/g,v('--green')).replace(/var\(--amber\)/g,v('--amber')).replace(/var\(--red\)/g,v('--red')).replace(/var\(--purple\)/g,v('--purple')).replace(/var\(--display\)/g,'"Departure Mono",monospace').replace(/\.il /g,'');
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" width="200" height="140"><defs><radialGradient id="ilGlow"><stop offset="0" stop-color="${v('--accent')}" stop-opacity=".16"/><stop offset="1" stop-color="${v('--accent')}" stop-opacity="0"/></radialGradient><radialGradient id="ilFloor"><stop offset="0" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs><style>${css}</style>${ART[id].draw()}</svg>`;
}
window.ilStandalone=ilStandalone;

/* ===================== commit hover card ===================== */
const relTime=t=>{const n=parseInt(t),u=t.replace(/\d+/g,'');const w={h:'hour',d:'day',w:'week',y:'year'}[u]||u;return `${n} ${w}${n===1?'':'s'} ago`};
function commitCard(n){
  const c=csBy[n];if(!c)return '';
  const fl=filesOf(c),refsHere=[...(heads[c.b]===c.n?[`<span class="ref">${I('branch',11)}${c.b}</span>`]:[]),...refs.tags.filter(t=>t.node===c.n).map(t=>`<span class="ref">${I('tag',11)}${t.name}</span>`),...refs.bookmarks.filter(b=>b.node===c.n).map(b=>`<span class="ref">${I('bookmark',11)}${b.name}</span>`)];
  const merge=c.p.length>1;
  const stats=merge&&!c.f?'Clean merge: no changes beyond the merge itself':c.bin?'1 file changed (binary)':`${c.f} file${c.f===1?'':'s'} changed, <span class="add">${c.a} insertion${c.a===1?'':'s'}(+)</span>, <span class="del">${c.d} deletion${c.d===1?'':'s'}(−)</span>`;
  return `<div class="hc-sec hc-who"><span class="avatar" style="width:30px;height:30px">B</span><div style="display:grid;line-height:1.35;min-width:0"><span><span class="nm">${c.author}</span> <span class="em">&lt;${c.email}&gt;</span></span><span class="tm">${relTime(c.t)} (${c.date})</span></div></div>
    <div class="hc-sec"><div class="hc-title">${esc(c.m)}</div>${c.body?`<div class="hc-body">${esc(c.body)}</div>`:''}
      <div class="row" style="flex-wrap:wrap;gap:6px;margin-top:10px"><span class="ref"><i style="width:7px;height:7px;border-radius:50%;background:${BR[c.b]}"></i>${c.b}</span>${refsHere.filter(x=>!x.includes(c.b)).join('')}${merge?'<span class="pill" style="height:20px">merge</span>':''}</div></div>
    <div class="hc-sec"><div class="hc-stats">${stats}</div>${fl.length?`<div class="hc-files">${fl.slice(0,5).map(f=>`<div><span class="st-b ${f.st}">${f.st}</span>${fileIcon(f.path.split('/').pop())}<span class="grow">${f.path}</span>${bar(f.a,f.d)}</div>`).join('')}${fl.length>5?`<div class="muted">and ${fl.length-5} more</div>`:''}</div>`:''}</div>
    <div class="hc-sec hc-acts"><span class="hash" style="color:var(--text)">${short(c.n)}</span><button onclick="copy('${c.n}','Hash')">${I('copy',13)}Copy</button><span class="sep">|</span><a href="#/r/sigma-reckitt/c/${c.n}">Open changeset</a><span class="sep">|</span><a href="#/r/sigma-reckitt/code" onclick="state.branch='${c.b}'">Browse files</a>${c.p[0]?`<span class="sep">|</span><a href="#/r/sigma-reckitt/c/${c.p[0]}">Parent ${short(c.p[0]).slice(0,7)}</a>`:''}</div>`;
}
const HC={showT:0,hideT:0,cur:null,anchor:null,mx:0,my:0};
document.addEventListener('mousemove',e=>{HC.mx=e.clientX;HC.my=e.clientY},{passive:true});
// The card opens to the right of the cursor, its top level with the pointer.
// Only if there is no room on the right does it fall back to the left side.
function hcShow(n,anchor,x,y){
  const el=$('#hcard');clearTimeout(HC.hideT);
  if(HC.cur!==n){el.innerHTML=commitCard(n);HC.cur=n}
  HC.anchor=anchor;el.classList.add('show');
  const ar=anchor.getBoundingClientRect(),w=el.offsetWidth,h=el.offsetHeight,gap=18;
  if(x==null){x=Math.min(ar.left+ar.width*.45,ar.right-40);y=ar.top+ar.height/2}  // keyboard focus: no pointer
  let left=x+gap;if(left+w>innerWidth-8)left=Math.max(8,x-gap-w);
  let top=y-28;top=Math.max(8,Math.min(top,innerHeight-h-8));
  el.style.left=left+'px';el.style.top=top+'px';
}
function hcHide(now){clearTimeout(HC.showT);clearTimeout(HC.hideT);const go_=()=>{$('#hcard').classList.remove('show');HC.cur=null;HC.anchor=null};now?go_():HC.hideT=setTimeout(go_,220)}

const TODAY=new Date(2026,9,5);
const HEAT=(()=>{const start=new Date(TODAY);start.setDate(start.getDate()-((start.getDay()+6)%7)-29*7);
  const rs=[['sigma-reckitt','#58a6ff'],['payments-api','#3fb950'],['infra-scripts','#e3b341'],['design-tokens','#bc8cff']];const out=[];
  for(let i=0;i<210;i++){const d=new Date(start);d.setDate(start.getDate()+Math.floor(i/7)*7+i%7);
    if(d>TODAY){out.push({d,fut:true,n:0,l:0});continue}
    const x=Math.sin(i*12.9898)*43758.5453,r=x-Math.floor(x),k=Math.floor(r*1000);
    let n=r>.86?8+k%5:r>.72?5+k%3:r>.55?3+k%2:r>.38?1+k%2:0;if(i%7>=5)n=Math.floor(n/3);
    const by=[];let left=n;rs.forEach(([name,c],j)=>{if(!left)return;const take=j===rs.length-1?left:Math.min(left,Math.ceil(left*[.55,.6,.7,1][j]));if(take>0){by.push({name,c,n:take});left-=take}});
    out.push({d,n,by,a:n*(11+k%37),del:n*(2+k%9),l:n===0?0:n<=2?1:n<=4?2:n<=7?3:4});}
  return out})();
const fmtDay=d=>d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
const heatStats=(()=>{const live=HEAT.filter(h=>!h.fut);const total=live.reduce((s,h)=>s+h.n,0);const busiest=live.reduce((a,b)=>b.n>a.n?b:a);
  let best=0,run=0;live.forEach(h=>{run=h.n?run+1:0;best=Math.max(best,run)});let cur=0;for(let i=live.length-1;i>=0&&live[i].n;i--)cur++;
  const active=live.filter(h=>h.n).length;return {total,busiest,best,cur,active,days:live.length}})();

function sparkline(vals,color,w=84,h=26){
  const max=Math.max(...vals,1),step=w/(vals.length-1);
  const pts=vals.map((v,i)=>[+(i*step).toFixed(1),+(h-3-(v/max)*(h-6)).toFixed(1)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join(' ');
  const id='g'+Math.random().toString(36).slice(2,7);const last=pts[pts.length-1];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true" style="overflow:visible"><defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".28"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <path d="${line} L${w} ${h} L0 ${h}Z" fill="url(#${id})"/><path d="${line}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${last[0]}" cy="${last[1]}" r="2.4" fill="${color}"/></svg>`;
}
function fuzzy(text,q){if(!q)return{ok:true,html:esc(text),score:0};const t=text.toLowerCase(),qq=q.toLowerCase();

  let j=0,out='',hits=0;for(let i=0;i<text.length;i++){if(j<qq.length&&t[i]===qq[j]){out+='<mark>'+esc(text[i])+'</mark>';j++;hits++}else out+=esc(text[i])}
  return j===qq.length?{ok:true,html:out,score:hits}:{ok:false}}

  const cp=$('#clonePop');if(cp&&!cp.hidden&&!e.target.closest('#clonePop,#cloneBtn')){cp.hidden=true;$('#cloneBtn').setAttribute('aria-expanded','false')}});
document.addEventListener('scroll',e=>{if(popTrigger&&!e.target.closest?.('#pop'))closeMenu()},true);
window.addEventListener('resize',()=>closeMenu());
const dd=(menu,label,attrs='',cls='')=>`<button class="dd ${cls}" data-menu="${menu}" aria-haspopup="listbox" aria-expanded="false" ${attrs}><span class="v">${label}</span><span class="chev">${I('chev',14)}</span></button>`;

/* ===================== dialogs ===================== */
function dialog({title,sub,body,actions,wide}){
  const d=$('#dlg');d.innerHTML=`<div class="dialog" style="${wide?'width:620px':''}"><div class="dh"><div><h2 class="h2">${title}</h2>${sub?`<p>${sub}</p>`:''}</div><button class="icon-btn sm" aria-label="Close" onclick="closeDialog()">${I('x',15)}</button></div><div class="db">${body}</div>${actions?`<div class="df">${actions}</div>`:''}</div>`;
  d.classList.add('open');setTimeout(()=>(d.querySelector('input,textarea,.dd,.btn.primary')||d.querySelector('.icon-btn')).focus(),0);
}
function closeDialog(){$('#dlg').classList.remove('open')}
$('#dlg').onclick=e=>{if(e.target.id==='dlg')closeDialog()};

function feedItem(e){return `<div class="feed-i"><span class="feed-ic" style="${e.fail?'color:var(--red);border-color:rgba(248,81,73,.35)':''}">${I(e.ic,14)}</span>

function pageRepos(){
  const sortLabel={updated:'Recently updated',name:'Name',stars:'Most watched'}[state.sort];
  return {html:`<div class="page">
  <div class="between" style="margin-bottom:16px"><div><h1 class="h1">Repositories</h1><p class="lead">Everything you can reach in sigma.</p></div><button class="btn primary" onclick="go('#/new')">${I('plus',15)}New repository</button></div>
  <div class="row" style="margin-bottom:12px;flex-wrap:wrap">
    <label class="input-wrap" style="flex:1;min-width:220px">${I('search',15)}<input id="repoFilter" placeholder="Filter by name or description"></label>
    <div class="seg">${[['all','All'],['public','Public'],['private','Private'],['archived','Archived']].map(([k,l])=>`<button class="${state.repoTab===k?'on':''}" onclick="state.repoTab='${k}';render()">${l}<span class="n">${repoList('',k).length}</span></button>`).join('')}</div>
    ${dd('sort',`${I('sort',14)} ${sortLabel}`,'','sm')}
  </div>
  <div class="card scroll-x"><table class="t"><thead><tr><th>Name</th><th>Access</th><th>Status</th><th class="hide-m">Activity</th><th style="text-align:right">Updated</th><th></th></tr></thead>
  <tbody id="repoRows">${repoRows('')}</tbody></table>
  <div class="pager"><span>Showing ${repoList('',state.repoTab).length} of ${repos.length}</span><span class="row"><button class="btn sm" disabled>Previous</button><button class="btn sm" disabled>Next</button></span></div></div></div>`};
}
function repoList(q,tab=state.repoTab){let l=repos.filter(r=>(r.slug+r.desc).toLowerCase().includes(q.toLowerCase()));
  if(tab==='public')l=l.filter(r=>r.vis==='public');if(tab==='private')l=l.filter(r=>r.vis==='private');if(tab==='archived')l=l.filter(r=>r.state==='archived');
  if(state.sort==='name')l=[...l].sort((a,b)=>a.slug.localeCompare(b.slug));if(state.sort==='stars')l=[...l].sort((a,b)=>b.stars-a.stars);return l}
function repoRows(q){
  const list=repoList(q);
  if(!list.length)return `<tr><td colspan="6">${es('no-results',{title:`No repositories match “${esc(q)}”`,body:'Try a shorter name, or clear the filter.',size:140})}</td></tr>`;
  return list.map(r=>`<tr><td><a href="#/r/${r.slug}" style="display:grid;gap:2px"><span style="font-family:var(--display);font-size:13.5px">${r.slug}</span><span class="muted" style="font-size:12.5px">${esc(r.desc)}</span></a></td>
  <td><span class="row">${visPill(r.vis)}<span class="pill ${roleColor[r.role]}">${r.role}</span></span></td>
  <td><span class="pill ${stateColor[r.state]}"><span class="d"></span>${r.state}</span></td><td class="hide-m">${sparkline(r.activity,r.color,72,20)}</td><td class="num">${r.updated}</td>
  <td style="text-align:right"><button class="icon-btn sm" data-menu="repoRow" data-slug="${r.slug}" aria-label="More actions for ${r.slug}" aria-expanded="false">${I('dots',16)}</button></td></tr>`).join('');
}

/* ---------- repository chrome ---------- */
function repoHead(r,tab){
  const openPr=PRS.filter(p=>p.repo===r.slug&&p.state==='open').length;
  const tabs=[['','Overview','eye'],['code','Code','file'],['history','History','commit',cs.length],['pulls','Pull requests','pr',openPr||''],['refs','Branches & tags','branch',6],...(state.anon||!r.role||r.role==='read'?[]:[['settings','Settings','gear']])];
  return `<div class="repo-head">
    <div class="between" style="flex-wrap:wrap">
      <div><div class="repo-title"><span class="crumb"><a href="${state.anon?'#/explore':'#/org'}">${r.org}</a> / <b>${r.slug}</b></span>${r.vis==='internal'?`<span class="pill">${I('org',11)}Internal</span>`:visPill(r.vis)}${r.state!=='ready'?`<span class="pill ${stateColor[r.state]||'red'}">${r.state}</span>`:''}</div>
      <p class="repo-desc">${esc(r.desc)}</p></div>
      <div class="row" style="position:relative">
        ${state.anon?`<a class="btn" href="#/login">${I('eye',15)}Sign in to watch</a>`:`<button class="btn" onclick="this.classList.toggle('on');toast(this.classList.contains('on')?'Watching ${r.slug}':'Stopped watching','info')">${I('eye',15)}Watch</button>`}
        <button class="btn primary" id="cloneBtn" aria-expanded="false" onclick="toggleClone('${r.slug}')">${I('down',15)}Clone</button>
        <div class="card clone-pop" id="clonePop" hidden>
          <div class="card-h"><span class="h3">Clone ${r.slug}</span><div class="seg"><button class="on" data-proto="ssh">SSH</button><button data-proto="https">HTTPS</button></div></div>
          <div class="card-b stack" style="gap:10px">
            <div class="copyline"><code id="cloneCmd">hg clone ssh://hg@revforge.sigma.dev/sigma/${r.slug}</code><button class="icon-btn sm" onclick="copy($('#cloneCmd').textContent,'',this)" aria-label="Copy">${I('copy',14)}</button></div>
            <p class="muted" id="cloneHint" style="margin:0;font-size:12.5px">${state.anon?'Public repository: anyone can clone over HTTPS without signing in.':'Uses the SSH key “MacBook Pro”. <a href="#/settings/ssh-keys" class="link">Manage keys</a>'}</p>
          </div></div>
      </div>
    </div>
    ${r.state==='archived'?`<div class="callout" style="margin-top:10px">${I('archive',16)}<div><b>This repository is archived</b><p>It’s read-only. Clones still work; pushes and new pull requests are rejected.${state.anon?'':' <a class="link" href="#/r/'+r.slug+'/settings/danger">Unarchive</a>'}</p></div></div>`:''}
    <nav class="tabs" aria-label="Repository sections">${tabs.map(([k,l,ic,n])=>`<a class="${tab===k?'on':''}" href="#/r/${r.slug}${k?'/'+k:''}">${I(ic,15)}${l}${n?`<span class="n">${n}</span>`:''}</a>`).join('')}</nav>
  </div>`;
}
window.toggleClone=slug=>{const p=$('#clonePop'),b=$('#cloneBtn');p.hidden=!p.hidden;b.setAttribute('aria-expanded',String(!p.hidden));if(state.anon){$('#cloneCmd').textContent='hg clone https://revforge.sigma.dev/hg/'+(findRepo(slug)||{org:'sigma'}).org+'/'+slug;p.querySelector('.seg').style.display='none'}
  p.querySelectorAll('[data-proto]').forEach(x=>x.onclick=()=>{p.querySelectorAll('[data-proto]').forEach(y=>y.classList.toggle('on',y===x));
    const https=x.dataset.proto==='https';$('#cloneCmd').textContent=https?'hg clone https://revforge.sigma.dev/hg/sigma/'+slug:'hg clone ssh://hg@revforge.sigma.dev/sigma/'+slug;
    $('#cloneHint').innerHTML=https?'Use a personal access token as the password. <a href="#/settings/tokens" class="link">Create a token</a>':'Uses the SSH key “MacBook Pro”. <a href="#/settings/ssh-keys" class="link">Manage keys</a>';})};

function rail(r,{path='',file=false}={}){
  const node=heads[state.branch]||heads.default;
  const parts=path?path.split('/'):[];let acc='';
  const crumbs=parts.map((p,i)=>{acc+=(i?'/':'')+p;return i===parts.length-1?`<b>${esc(p)}</b>`:`<a href="#/r/${r.slug}/code/${acc}">${esc(p)}</a><span class="sep">/</span>`}).join('');
  return `<div class="rail" role="toolbar" aria-label="Revision and path">
    <button data-menu="branch" aria-haspopup="listbox" aria-expanded="false" data-tip="Switch branch, bookmark or tag"><i style="width:8px;height:8px;border-radius:50%;background:${BR[state.branch]};display:inline-block"></i>${state.branch.replace('feature/','')}${I('chev',12)}</button>
    <button class="rev" data-tip="Open this changeset" onclick="go('#/r/${r.slug}/c/${node}')">@ <span class="hash" style="color:inherit">${short(node)}</span></button>
    <div class="path"><a href="#/r/${r.slug}/code">${r.slug}</a>${parts.length?'<span class="sep">/</span>':''}${crumbs}</div>
    <button class="tool" onclick="copy(location.href,'Permalink')">${I('link',14)}<span>Permalink</span></button>
    ${file?`<button class="tool" onclick="go('#/r/${r.slug}/history?path=${encodeURIComponent(path)}')">${I('clock',14)}<span>History</span></button>`:''}
  </div>`;
}

function fileTable(r,prefix=''){
  const node=prefix?prefix.split('/').reduce((n,p)=>n.kids[p],TREE):TREE;
  const kids=Object.values(node.kids).sort((a,b)=>(b.dir-a.dir)||a.name.localeCompare(b.name));
  return `<table class="t"><tbody>${prefix?`<tr><td colspan="3"><a class="f-name" href="#/r/${r.slug}/code/${prefix.split('/').slice(0,-1).join('/')}">${folderIcon('',true)}..</a></td></tr>`:''}${kids.map(k=>{const c=csBy[lastOf(k.path)];
    return `<tr><td><a class="f-name" href="#/r/${r.slug}/code/${k.path}">${k.dir?folderIcon(k.name,false):fileIcon(k.name)}${k.name}</a></td>
    <td class="f-msg"><a href="#/r/${r.slug}/c/${c.n}">${esc(c.m)}</a></td><td class="f-age">${c.t} ago</td></tr>`}).join('')}</tbody></table>`;
}

function guardRepo(r,tab){
  if(r.state==='failed')return {ws:true,html:repoHead(r,tab)+`<div class="ws-body"><div class="pane"><div class="card">${es('load-error',{title:'Provisioning failed',body:'Mercurial storage for '+r.slug+' couldn’t be created. Nothing was pushed yet, so retrying is safe.',size:190,actions:`<button class="btn primary" onclick="toast('Provisioning restarted','info')">${I('refresh',14)}Retry provisioning</button><button class="btn" onclick="copy('prov_7Kq2 storage: permission denied on /data/repositories/sigma','Error details')">Copy error details</button>`})}
    <details style="max-width:560px;margin:0 auto 24px;font-size:12.5px"><summary class="muted" style="cursor:pointer">What happened</summary><pre class="card" style="padding:10px;font:12px var(--mono);margin-top:8px;white-space:pre-wrap">12:04:11 started on forge-01
12:04:12 hg init failed: permission denied on the repository volume

function graphSvg(list){
  const H=57,X=l=>20+l*18,Y=i=>i*H+28;const idx=Object.fromEntries(list.map((c,i)=>[c.n,i]));let paths='',dots='';
  list.forEach((c,i)=>{

      const x1=X(c.lane),y1=Y(i),x2=X(pc.lane),y2=Y(j),tx=X(Math.max(c.lane,pc.lane));
      const col=Math.max(c.lane,pc.lane)===c.lane?BR[c.b]:BR[pc.b];let d;
      if(j-i===1||x1===x2&&x2===tx){d=x1===x2?`M${x1} ${y1}V${y2}`:`M${x1} ${y1}C${x1} ${y1+H/2} ${x2} ${y2-H/2} ${x2} ${y2}`}
      else{const b=H/2;d=`M${x1} ${y1}`;if(x1!==tx)d+=`C${x1} ${y1+b*.6} ${tx} ${y1+b*.4} ${tx} ${y1+b}`;d+=`V${y2-(tx!==x2?b:0)}`;if(tx!==x2)d+=`C${tx} ${y2-b*.4} ${x2} ${y2-b*.6} ${x2} ${y2}`}

  });

        <div class="chg">${fl.map((f,i)=>`<a href="#" onclick="event.preventDefault();document.getElementById('df${i}').scrollIntoView({behavior:'smooth',block:'start'})"><span class="st-b ${f.st}">${f.st}</span>${fileIcon(f.path.split('/').pop())}<span class="grow">${f.path.split('/').pop()}</span></a>`).join('')}</div></div>
      <div class="pane flush">${fl.map((f,i)=>{let o=f.h.match(/-(\d+)/)[1]*1,n=f.h.match(/\+(\d+)/)[1]*1;
        return `<div class="card diff-file" id="df${i}"><div class="card-h"><span class="row"><span class="st-b ${f.st}">${f.st}</span>${fileIcon(f.path.split('/').pop())}${f.path}${copyBtn(f.path,'Copy path')}</span><span class="row"><span class="mono" style="font-size:11.5px"><span class="add">+${f.a}</span> <span class="del">−${f.d}</span></span>${bar(f.a,f.d)}</span></div>
        <div class="diff"><table><tr class="h"><td class="ln"></td><td class="ln"></td><td>${esc(f.h)}</td></tr>${f.lines.map(([k,t])=>{const ol=k==='+'?'':o++,nl=k==='-'?'':n++;return `<tr class="${k==='+'?'a':k==='-'?'d':''}"><td class="ln">${ol}</td><td class="ln">${nl}</td><td class="c">${k==='+'?'+':k==='-'?'−':' '} ${hl(t,'cpp')}</td></tr>`}).join('')}</table></div></div>`}).join('')}</div>
    </div></div>`};
}

function pageRefs(r,kind='branches'){
  const g=guardRepo(r,'refs');if(g)return g;
  const ic={branches:'branch',bookmarks:'bookmark',tags:'tag'};
  return {ws:true,html:repoHead(r,'refs')+`<div class="ws-body">
    <div class="between" style="flex-wrap:wrap;flex:none">
      <div class="seg">${['branches','bookmarks','tags'].map(k=>`<a class="${k===kind?'on':''}" href="#/r/${r.slug}/refs/${k}">${I(ic[k],14)}${k[0].toUpperCase()+k.slice(1)}<span class="n">${refs[k].length}</span></a>`).join('')}</div>
      <label class="input-wrap" style="width:260px;max-width:100%">${I('search',14)}<input placeholder="Filter ${kind}"></label>
    </div>
    <div class="pane">
    <p class="muted" style="font-size:13px;margin:0 0 12px">${{branches:'Named branches are permanent in Mercurial: every changeset records the branch it was made on.',bookmarks:'Bookmarks are movable pointers. They move forward when you commit on top of them.',tags:'Tags pin a name to one changeset for good, typically a release.'}[kind]}</p>
    <div class="card scroll-x"><table class="t"><thead><tr><th>Name</th><th>Points to</th>${kind==='branches'?'<th>Status</th>':''}<th style="text-align:right">Updated</th><th></th></tr></thead><tbody>
    ${refs[kind].map(x=>{const c=csBy[x.node];return `<tr><td><span class="row" style="font-family:var(--mono);font-size:13px">${kind==='branches'?`<i style="width:8px;height:8px;border-radius:50%;background:${BR[x.name]};display:inline-block"></i>`:I(ic[kind],14)}${x.name}${x.name==='default'?'<span class="pill blue">default</span>':''}</span></td>
      <td><a href="#/r/${r.slug}/c/${c.n}" style="display:grid;gap:1px"><span class="hash">${short(c.n)}</span><span class="muted" style="font-size:12.5px;max-width:42ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.m)}</span></a></td>
      ${kind==='branches'?`<td><span class="pill ${x.state==='open'?'green':'purple'}"><span class="d"></span>${x.state}</span></td>`:''}
      <td class="num">${x.t}</td><td style="text-align:right;white-space:nowrap"><a class="btn ghost sm" href="#/r/${r.slug}/history" onclick="state.histBranch='${kind==='branches'?x.name:''}'">History</a><a class="btn ghost sm" href="#/r/${r.slug}/code" onclick="${kind==='branches'?`state.branch='${x.name}'`:''}">Browse</a></td></tr>`}).join('')}
    </tbody></table></div></div></div>`};
}

function settingsPanes(nav,active,base,content,pre=''){
  return `<div class="panes" style="grid-template-columns:200px minmax(0,1fr)">

    <div class="pane"><div style="max-width:860px">${content}</div></div></div>`;
}

  const fo=state.icKind==='files'?[]:folders.filter(ok),fi=state.icKind==='folders'?[]:files.filter(ok);
  const group=(arr,render)=>{const cats=[...new Set(arr.map(x=>x.cat))];return cats.map(c=>`<div class="kit-label">${c} <span class="subtle">${arr.filter(x=>x.cat===c).length}</span></div><div class="icon-gal">${arr.filter(x=>x.cat===c).map(render).join('')}</div>`).join('')};
  const tile=(it,icon)=>`<button class="ic-tile" data-svg="${esc(icon)}" title="${esc(it.label)}">${icon}<span class="tx"><span>${esc(it.name)}</span><small>${esc(it.label.split(' ').slice(1,4).join(' '))}</small></span></button>`;
  g.innerHTML=(fo.length?`<h3 class="h3" style="margin:4px 0 0">Folders <span class="subtle">${fo.length}</span></h3>`+group(fo,it=>tile(it,folderIcon(it.name,false)+folderIcon(it.name,true))):'')+
    (fi.length?`<h3 class="h3" style="margin:18px 0 0">Files <span class="subtle">${fi.length}</span></h3>`+group(fi,it=>tile(it,fileIcon(it.name))):'')+
    (!fo.length&&!fi.length?es('no-results',{title:`No icons match “${esc(q)}”`,body:'Unknown types fall back to the plain document icon.',size:120}):'');
  g.querySelectorAll('.ic-tile').forEach(b=>b.onclick=()=>{const svgs=b.dataset.svg.replace(/class="fi"/g,'xmlns="http://www.w3.org/2000/svg" width="16" height="16"');copy(svgs,'SVG')});
}

  if(!html)html=`<div style="padding:10px">${es('no-results',{title:'No people match',body:PK.scope==='org'?'Type a full email address to invite someone who isn’t on RevForge yet.':'Only sigma members can be given access here.',size:96,pad:'10px'})}</div>`;

  chips.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{PK.sel=PK.sel.filter(s=>(s.name||s.email)!==b.dataset.rm);drawPicker()});
  const cnt=$('#pkCount');if(cnt){cnt.textContent=PK.sel.length;cnt.closest('button').disabled=!PK.sel.length}
}
function wirePicker(){const i=$('#pkQ');if(!i)return;i.oninput=()=>{PK.q=i.value;PK.idx=0;drawPicker()};
  i.onkeydown=e=>{const its=[...$('#pkList').querySelectorAll('.pk-i:not(:disabled)')];if(e.key==='ArrowDown'){e.preventDefault();PK.idx=Math.min(PK.idx+1,its.length-1)}else if(e.key==='ArrowUp'){e.preventDefault();PK.idx=Math.max(PK.idx-1,0)}else if(e.key==='Enter'){e.preventDefault();its[PK.idx]?.click();return}else if(e.key==='Backspace'&&!i.value&&PK.sel.length){PK.sel.pop()}else return;drawPicker()};drawPicker()}

function pageExplore(query){
  const q=(query.get('q')??state.exQ)||'';state.exQ=q;
  const pool=ALLREPOS().filter(r=>!r.noaccess&&(state.anon?r.vis==='public':true));
  const match=r=>{if(!q)return true;const s=(r.org+'/'+r.slug+' '+r.desc+' '+r.lang).toLowerCase();return q.toLowerCase().split(/\s+/).every(w=>s.includes(w))};
  let res=pool.filter(match);const facet=(k)=>{const m={};res.forEach(r=>m[r[k]]=(m[r[k]]||0)+1);return Object.entries(m).sort((a,b)=>b[1]-a[1])};
  const langs=facet('lang'),orgsF=facet('org'),vis=facet('vis');
  if(state.exLang)res=res.filter(r=>r.lang===state.exLang);if(state.exOrg)res=res.filter(r=>r.org===state.exOrg);if(state.exVis)res=res.filter(r=>r.vis===state.exVis);
  res.sort((a,b)=>b.stars-a.stars);
  const hi=t=>{let h=esc(t);q.split(/\s+/).filter(Boolean).forEach(w=>{h=h.replace(new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>')});return h};
  const fac=(title,list,key)=>`<h4>${title}</h4>${list.map(([v,n])=>`<label><input type="radio" name="${key}" ${state[key]===v?'checked':''} onchange="state.${key}='${v}';render()" style="accent-color:var(--accent)">${key==='exLang'?`<i style="width:8px;height:8px;border-radius:50%;background:${(ALLREPOS().find(r=>r.lang===v)||{}).color};display:inline-block"></i>`:''}${v}<span class="n">${n}</span></label>`).join('')}${state[key]?`<label onclick="state.${key}='';render()" style="color:var(--accent)">Clear</label>`:''}`;
  const orgHits=q?orgs.filter(o=>(o.name+' '+o.slug).toLowerCase().includes(q.toLowerCase())):[];
  return {ws:true,html:`${state.anon?`<div class="anon-strip">${I('info',15)}<span>You’re browsing public repositories. <a class="link" href="#/login">Sign in</a> to see internal and private ones you have access to.</span></div>`:''}
  <div class="ws-body">
    <div style="flex:none;max-width:900px;width:100%;margin:0 auto"><h1 class="h1" style="margin-bottom:12px">${q?'Search results':'Explore repositories'}</h1>
      <label class="big-search">${I('search',18)}<input id="exQ" value="${esc(q)}" placeholder="Search by name, description or language" aria-label="Search repositories"><kbd>↵</kbd></label>
      ${!q?`<div class="row" style="margin-top:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)">Try ${['graph','bookmarks','python','export'].map(s=>`<a class="ref" href="#/explore?q=${s}">${s}</a>`).join('')}</div>`:''}</div>
    <div class="panes" style="grid-template-columns:220px minmax(0,1fr);max-width:1100px;width:100%;margin:0 auto">
      <aside class="pane facet">${fac('Language',langs,'exLang')}${fac('Organization',orgsF,'exOrg')}${state.anon?'':fac('Visibility',vis,'exVis')}</aside>
      <div class="pane">
        ${orgHits.length?`<div class="card" style="margin-bottom:14px">${orgHits.map(o=>`<a class="res" href="#/org"><span class="org-dot" style="width:36px;height:36px;font-size:16px;border-radius:8px">${o.name[0]}</span><div><div class="t">${hi(o.name)}</div><div class="m">Organization, ${o.repos} repositories</div></div></a>`).join('')}</div>`:''}
        <div class="between" style="margin-bottom:10px"><span class="muted" style="font-size:13px">${res.length} repositor${res.length===1?'y':'ies'}${q?` for “${esc(q)}”`:''}</span>${dd('sort','Most watched','','sm')}</div>
        ${res.length?`<div class="card">${res.map(r=>`<a class="res" href="#/r/${r.slug}"><span class="org-dot" style="width:36px;height:36px;font-size:16px;border-radius:8px;background:${r.color}22;color:${r.color}">${r.org[0].toUpperCase()}</span>
          <div style="display:grid;gap:5px;min-width:0"><div class="row" style="flex-wrap:wrap"><span class="t">${hi(r.org)} / ${hi(r.slug)}</span>${r.vis!=='public'?`<span class="pill">${I(r.vis==='internal'?'org':'lock',11)}${r.vis}</span>`:''}</div>
          ${r.desc?`<p>${hi(r.desc)}</p>`:''}<div class="m"><span class="row" style="gap:5px"><i style="width:8px;height:8px;border-radius:50%;background:${r.color};display:inline-block"></i>${r.lang}</span><span>${I('eye',12)} ${r.stars}</span><span>Updated ${r.updated} ago</span></div></div>
          <span class="hide-m">${sparkline(r.activity.length?r.activity:[0,0],r.color,80,26)}</span></a>`).join('')}</div>`
          :`<div class="card">${es('no-results',{title:`No repositories match “${esc(q)}”`,body:state.anon?'You’re only seeing public repositories. Sign in to search internal and private ones you can access.':'Try fewer words, or clear the filters.',actions:state.anon?'<a class="btn primary" href="#/login">Sign in</a>':`<button class="btn" onclick="state.exLang=state.exOrg=state.exVis='';go('#/explore')">Clear search</button>`})}</div>`}
      </div></div></div>`};
}
