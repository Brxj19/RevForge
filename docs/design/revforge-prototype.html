/* ---------- pull requests ---------- */
const prIc=s=>`<span class="pr-ic ${s}">${I(s==='merged'?'merge':s==='closed'?'prClosed':s==='draft'?'prDraft':'pr',16)}</span>`;
const rvStack=p=>`<span class="row" style="gap:6px">${p.reviewers.map(r=>`<span class="rv" title="${r.u}: ${r.dec.replace('_',' ')}${r.req?' (required)':''}">${avt(r.u,22)}<i class="mk ${r.dec}"></i></span>`).join('')}</span>`;
function prRow(p,showRepo){const app=p.reviewers.filter(r=>r.dec==='approved').length;
  return `<div class="pr-row">${prIc(p.state)}<div style="min-width:0"><a class="t" href="#/r/${p.repo}/pulls/${p.n}">${showRepo?`<span class="muted" style="font-weight:400">${p.repo} </span>`:''}${esc(p.title)}</a>
    <div class="m"><span>#${p.n}</span><span>${p.state==='merged'?'merged':p.state==='closed'?'closed':'opened'} ${p.state==='merged'||p.state==='closed'?p.updated:p.created} ago by ${p.author}</span><span class="ref">${p.src.replace('feature/','')}</span>${I('chevr',11)}<span class="ref">${p.dst}</span>
    ${p.reviewers.some(r=>r.dec==='changes_requested')?'<span class="pill red">changes requested</span>':p.state==='open'&&p.reviewers.length&&p.reviewers.filter(r=>r.req).every(r=>r.dec==='approved')?'<span class="pill green">ready to merge</span>':''}</div></div>
    <div class="row" style="gap:14px;color:var(--muted);font-size:12px">${p.reviewers.length?`<span class="hide-m">${app}/${p.reviewers.length} approved</span>`:''}${rvStack(p)}<span class="row" style="gap:4px">${I('review',13)}${p.comments}</span></div></div>`}
function pageRepoPulls(r,query){
  const st=query.get('state')||'open';const all=PRS.filter(p=>p.repo===r.slug);const cnt=s=>all.filter(p=>p.state===s).length;

  return {ws:true,html:repoHead(r,'pulls')+`<div class="ws-body"><div class="between" style="flex:none;flex-wrap:wrap">
    <div class="seg">${['open','draft','merged','closed'].map(s=>`<a class="${st===s?'on':''}" href="#/r/${r.slug}/pulls?state=${s}">${prIc(s)}${s[0].toUpperCase()+s.slice(1)}<span class="n">${cnt(s)}</span></a>`).join('')}</div>
    <div class="row"><label class="input-wrap" style="width:240px">${I('search',14)}<input placeholder="Filter by title, author or branch"></label>${state.anon?'':`<a class="btn primary" href="#/r/${r.slug}/pulls/new">${I('plus',14)}New pull request</a>`}</div></div>
    <div class="pane">${list.length?`<div class="card">${list.map(p=>prRow(p)).join('')}</div>`:`<div class="card">${es(st==='open'?'all-caught-up':'no-results',{title:st==='open'?'No open pull requests':`No ${st} pull requests`,body:st==='open'?'Push a branch, then open a pull request to get it reviewed before it lands on default.':'They’ll appear here.',actions:st==='open'&&!state.anon?`<a class="btn primary" href="#/r/${r.slug}/pulls/new">New pull request</a>`:''})}</div>`}</div></div>`};

function pageReviews(){
  const tabs=[['requested','Review requested',p=>p.state==='open'&&p.reviewers.some(r=>r.u==='Brxj19'&&r.dec!=='approved')],['mine','Your pull requests',p=>p.author==='Brxj19'&&p.state!=='merged'&&p.state!=='closed'],['open','All open',p=>p.state==='open'||p.state==='draft'],['done','Recently closed',p=>p.state==='merged'||p.state==='closed']];
  const cur=tabs.find(t=>t[0]===state.revTab)||tabs[0];const list=PRS.filter(cur[2]);
  return {html:`<div class="page"><div class="between" style="margin-bottom:16px;flex-wrap:wrap"><div><h1 class="h1">Reviews</h1><p class="lead">Pull requests across sigma that need you, and the ones you opened.</p></div><a class="btn primary" href="#/r/sigma-reckitt/pulls/new">${I('plus',14)}New pull request</a></div>
    <div class="seg" style="margin-bottom:12px">${tabs.map(t=>`<button class="${t===cur?'on':''}" onclick="state.revTab='${t[0]}';render()">${t[1]}<span class="n">${PRS.filter(t[2]).length}</span></button>`).join('')}</div>
    <div class="card">${list.length?list.map(p=>prRow(p,true)).join(''):es('all-caught-up',{title:'Nothing waiting on you',body:'When someone requests your review, it shows up here and in your notifications.'})}</div></div>`};

function prHead(r,p,tab){
  const files=PRFILES[p.n]||[];

const code=(c,lang='')=>`<div class="codeblk"><pre>${esc(c)}</pre>${copyBtn(c,'Copy')}</div>`;
const DOCS=[
 ['Getting started',[
  ['intro','Introduction',()=>`<p>RevForge hosts Mercurial repositories on your own servers. It gives you a web interface for code and history, pull requests with enforced review rules, SSH and HTTPS transport, webhooks, and a complete audit log.</p><h2 id="d1">What you’ll need</h2><p>A Linux host with Docker, a DNS name, and port 22 or another port for SSH.</p><h2 id="d2">Concepts</h2><p><b>Organizations</b> own repositories and have members with roles. <b>Repositories</b> are public, internal (any organization member) or private. <b>Pull requests</b> propose merging one branch into another.</p>`],
  ['quickstart','Quick start (self-host)',()=>`<p>Bring up a complete forge with Docker Compose.</p><h2 id="d1">1. Download and configure</h2>${code('curl -O https://revforge.dev/compose.yml\ncp .env.example .env')}<p>Set these in <code>.env</code>. RevForge refuses to start in production with placeholder secrets or insecure cookies.</p>${code('REVFORGE_ENVIRONMENT=production\nREVFORGE_SESSION_SECRET_KEY=<64 hex chars>\nREVFORGE_TRANSPORT_TOKEN_SECRET=<64 hex chars>\nREVFORGE_SESSION_COOKIE_SECURE=true\nREVFORGE_PUBLIC_URL=https://forge.example.com')}<h2 id="d2">2. Start</h2>${code('docker compose up -d\ndocker compose exec api revforge create-admin you@example.com')}<div class="callout info">${I('info',16)}<div>The first account you create is a platform admin. Keep it for administration, not daily work.</div></div><h2 id="d3">3. Check it’s healthy</h2>${code('curl https://forge.example.com/api/v1/health')}`],
  ['clone','Clone and push',()=>`<h2 id="d1">Over SSH</h2><p>Add your public key under Your settings, then:</p>${code('hg clone ssh://hg@forge.example.com/sigma/sigma-reckitt')}<h2 id="d2">Over HTTPS</h2><p>Create an access token and use it as the password.</p>${code('hg clone https://forge.example.com/hg/sigma/sigma-reckitt')}<p>Save it in <code>~/.hgrc</code> so you aren’t asked every time:</p>${code('[auth]\nforge.prefix = https://forge.example.com\nforge.username = you@example.com\nforge.password = rf_pat_…')}<h2 id="d3">Pushing a new branch</h2>${code('hg push --new-branch')}`]]],

  ['refs','Branches, bookmarks and tags',()=>`<p><b>Named branches</b> are permanent: every changeset records its branch. <b>Bookmarks</b> are movable pointers, like lightweight branches. <b>Tags</b> pin a name to one changeset.</p>${code('hg branch feature/graph\nhg bookmark review/graph-api\nhg tag v1.0')}`],
  ['graph','Reading the graph',()=>`<p>Each lane is a line of development. The first-parent line of the default branch is always the leftmost lane. A second head on the same branch gets its own lane. Lanes are reused after branches merge.</p><p>Hollow nodes are merges. Hover any row to see the full message, stats and refs.</p>`]]],

  ['pulls','Pull requests and reviews',()=>`<p>A pull request proposes merging a source branch into a target branch. The source revision is pinned when it’s opened.</p><h2 id="d1">Merge requirements</h2><table class="t"><tbody><tr><td>No outstanding change requests</td><td>A reviewer who requested changes must approve or dismiss</td></tr><tr><td>Required reviewers approved</td><td>Each required reviewer’s latest review is an approval</td></tr><tr><td>Minimum approvals</td><td>Configurable per repository; the author’s own approval never counts</td></tr><tr><td>Revision unchanged</td><td>If the source moved after approval, a fresh review is needed</td></tr></tbody></table><h2 id="d2">How merging works</h2><p>RevForge updates to the target head, merges the source, commits, and pushes to the canonical repository, all under Mercurial’s lock. Conflicts stop the merge and are reported.</p>`],
  ['webhooks','Webhooks',()=>`<p>Webhooks send a signed <code>POST</code> for repository events. Only 2xx responses count as delivered; others are retried for 24 hours.</p><h2 id="d1">Events</h2><p><code>push</code>, <code>tag</code>, <code>bookmark</code>, <code>pull_request</code>, <code>ping</code></p><h2 id="d2">Payload</h2>${code(`{\n  "event": "push",\n  "repository": "sigma/sigma-reckitt",\n  "pusher": "brxj19",\n  "changesets": ["9f2a1c4e7b30…", "8e1b0d3f6a21…"],\n  "branch": "default"\n}`)}<h2 id="d3">Verifying the signature</h2><div class="dtabs"><button class="on">Python</button><button>Node</button><button>Go</button></div>${code(`import hmac, hashlib\n\ndef verify(secret: bytes, body: bytes, header: str) -> bool:\n    mac = hmac.new(secret, body, hashlib.sha256).hexdigest()\n    return hmac.compare_digest(f"sha256={mac}", header)`)}<div class="callout info">${I('info',16)}<div>Hooks to private, loopback or link-local addresses are rejected, including after DNS resolution.</div></div>`]]],
 ['Administration',[

 ['Reference',[

'README.md':`# sigma-reckitt

Small C++ library with a **binary search tree** and an **undirected graph**, used as the exercise repository for the Reckitt engagement.

> [!NOTE]
> This repository is hosted on RevForge. Clone it with \`hg clone ssh://hg@revforge.sigma.dev/sigma/sigma-reckitt\`.

## Build

\`\`\`sh
./scripts/build.sh          # or: make
./main
\`\`\`

Requires a C++17 compiler. CMake works too:

\`\`\`sh
cmake -S . -B build && cmake --build build
\`\`\`

## What's inside

| Component | File | Operations |
|---|---|---|
| BinaryTree | \`src/binary_tree.hpp\` | insert, contains, inorder_print |
| Graph | \`src/graph.hpp\` | add_edge, has_edge, bfs, print_adj |
| Utilities | \`src/util/strings.hpp\` | join, trim |

![BFS walk over a five-node graph](docs/graph-diagram.png)

## Roadmap

- [x] Binary tree with \`contains\`
- [x] Graph with BFS
- [ ] Dijkstra shortest path (see #7)
- [ ] Serialise graphs to JSON

## Contributing

Open a pull request against \`default\`. One approval is required, and you can't approve your own. See [the architecture notes](docs/architecture.md) and the [changelog](CHANGELOG.md).

---

Licensed under the [MIT License](LICENSE).`,
'CHANGELOG.md':`# Changelog

All notable changes to this project are documented here.

## [Unreleased]

### Added
- \`Graph::shortest_path\` (pull request #7, in review)

## [0.1.0] - 2026-07-13

### Added
- \`BinaryTree::contains\` and \`Graph::has_edge\` (#4)
- Binary tree and graph implementations (#3)
- Build script and CMake project

### Fixed
- Include paths in \`src/\` implementations`,
'docs/architecture.md':`# Architecture

The library is header-first: each data structure has a \`.hpp\` with the public API and a \`.cpp\` with the implementation.

## Layout

\`\`\`
src/
  binary_tree.{hpp,cpp}   unbalanced BST
  graph.{hpp,cpp}         adjacency-list graph
  util/                   small string helpers
tests/                    assert-based tests, one binary per file
\`\`\`

## Graph

Nodes are integers \`0..n-1\`. Edges are stored in both directions, so the graph is undirected.

> [!TIP]
> \`bfs\` returns nodes in visit order, which makes it easy to test.

### Complexity

| Operation | Time |
|---|---|
| add_edge | O(1) |
| has_edge | O(degree) |
| bfs | O(V + E) |

## Decisions

1. No external dependencies, so the exercise builds anywhere.
2. Raw pointers in \`BinaryTree\` keep the code readable; a destructor frees nodes.
3. Tests use plain \`assert\` instead of a framework.`,

## BinaryTree

### \`void insert(int value)\`
Adds \`value\`. Duplicates go to the right subtree.

### \`bool contains(int value) const\`
Returns \`true\` if \`value\` is in the tree.

## Graph

### \`std::vector<int> bfs(int start) const\`
Breadth-first walk from \`start\`.

\`\`\`cpp
Graph g(3);
g.add_edge(0, 1);
auto order = g.bfs(0); // {0, 1}

'scripts/bench.py':`"""Run the graph benchmark and write bench/results.csv."""
import csv
import subprocess
import time
from pathlib import Path

SIZES = [100, 1_000, 10_000, 100_000]


def run(n: int) -> float:
    start = time.perf_counter()
    subprocess.run(["./main", "--bench", str(n)], check=True, capture_output=True)
    return (time.perf_counter() - start) * 1000


def main() -> None:
    out = Path("bench/results.csv")
    with out.open("w", newline="") as f:
        writer = csv.writer(f)
        writer.writerow(["benchmark", "nodes", "ms", "ops_per_sec"])
        for n in SIZES:
            ms = run(n)
            writer.writerow(["bfs", n, f"{ms:.2f}", int(n / ms * 1000)])


if __name__ == "__main__":
    main()`,

'src/util/strings.cpp':`#include "strings.hpp"

namespace util {

std::string join(const std::vector<int>& values, const std::string& sep) {
    std::string out;
    for (size_t i = 0; i < values.size(); ++i) {
        if (i) out += sep;
        out += std::to_string(values[i]);
    }
    return out;
}

std::string trim(const std::string& s) {
    auto b = s.find_first_not_of(" \\t\\n");
    auto e = s.find_last_not_of(" \\t\\n");
    return b == std::string::npos ? "" : s.substr(b, e - b + 1);
}

}`,

function resolvePath(base,rel){if(/^(https?:|#|mailto:)/.test(rel))return null;const parts=(base?base.split('/').slice(0,-1):[]);rel.split('/').forEach(p=>{if(p==='..')parts.pop();else if(p!=='.')parts.push(p)});return parts.join('/')}
function mdInline(s,base){
  const E=x=>x.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const codes=[];
  s=s.replace(/`([^`]+)`/g,(m,c)=>{codes.push(`<code>${E(c)}</code>`);return `\u0000${codes.length-1}\u0000`});
  s=E(s);
  s=s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,(m,alt,u)=>{const p=resolvePath(base,u);const img=p&&IMG_DATA[p];const svg=p&&source[p]&&p.endsWith('.svg');
    return img?`<img src="${img.src}" alt="${alt}" width="${img.w}">`:svg?`<img src="data:image/svg+xml;utf8,${encodeURIComponent(source[p])}" alt="${alt}">`:`<span class="muted">[image: ${alt}]</span>`});
  s=s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,(m,t,u)=>{const p=resolvePath(base,u);return p&&files[p]?`<a href="#/r/sigma-reckitt/code/${p}">${t}</a>`:`<a href="${u}" onclick="event.preventDefault();toast('External link: ${u}','info')">${t}</a>`});
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*]+)\*/g,'$1<em>$2</em>').replace(/(^|\s)#(\d+)\b/g,'$1<a href="#/r/sigma-reckitt/pulls/$2">#$2</a>');

function mdRender(text,base='',mdx=false){

    if(mdx&&/^<([A-Z]\w*)([^>]*)>(.*)<\/\1>\s*$/.test(l)){const m=l.match(/^<([A-Z]\w*)([^>]*)>(.*)<\/\1>/);out+=`<div class="jsx">${I('component',14)} <code>&lt;${m[1]}&gt;</code> ${mdInline(m[3],base)}</div>`;i++;continue}
    if(/^```/.test(l)){const lang=l.slice(3).trim();const buf=[];i++;while(i<lines.length&&!/^```/.test(lines[i]))buf.push(lines[i++]);i++;const raw=buf.join('\n');
      const lid=lang==='sh'?'sh':lang==='cpp'?'cpp':lang==='py'||lang==='python'?'py':lang==='json'?'json':lang==='yaml'?'yaml':'txt';
      out+=`<pre>${lang?`<span class="lang">${lang}</span>`:''}<code>${hlAny(raw,lid)}</code>${copyBtn(raw,'Copy')}</pre>`;continue}
    let h=l.match(/^(#{1,6})\s+(.*)$/);if(h){const t=mdInline(h[2],base),id=slug(h[2]);out+=`<h${h[1].length} id="md-${id}"><a class="anchor" href="#" onclick="event.preventDefault();copy(location.href.split('#')[0]+location.hash+'#${id}','Link')">#</a>${t}</h${h[1].length}>`;i++;continue}
    if(/^\s*(---|\*\*\*)\s*$/.test(l)){out+='<hr>';i++;continue}
    if(/^>\s?/.test(l)){const buf=[];while(i<lines.length&&/^>\s?/.test(lines[i]))buf.push(lines[i++].replace(/^>\s?/,''));const a=buf[0].match(/^\[!(NOTE|TIP|WARNING|CAUTION|IMPORTANT)\]/);
      if(a){const k=a[1].toLowerCase();out+=`<div class="alert ${k}"><b>${I(k==='tip'?'check':k==='note'?'info':'warn',14)}${a[1][0]+a[1].slice(1).toLowerCase()}</b>${mdInline(buf.slice(1).join(' '),base)}</div>`}else out+=`<blockquote>${mdRender(buf.join('\n'),base)}</blockquote>`;continue}
    if(/^\|/.test(l)&&i+1<lines.length&&/^\|?\s*:?-+/.test(lines[i+1])){const row=x=>x.replace(/^\||\|$/g,'').split('|').map(c=>c.trim());const hd=row(l);i+=2;const rows=[];while(i<lines.length&&/^\|/.test(lines[i]))rows.push(row(lines[i++]));
      out+=`<table><thead><tr>${hd.map(c=>`<th>${mdInline(c,base)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${mdInline(c,base)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;continue}
    if(/^\s*([-*]|\d+\.)\s+/.test(l)){const ol=/^\s*\d+\./.test(l);const items=[];while(i<lines.length&&/^\s*([-*]|\d+\.)\s+/.test(lines[i]))items.push(lines[i++].replace(/^\s*([-*]|\d+\.)\s+/,''));
      out+=`<${ol?'ol':'ul'}>${items.map(t=>{const tk=t.match(/^\[( |x)\]\s+(.*)/i);return tk?`<li class="task"><input type="checkbox" disabled ${tk[1]!==' '?'checked':''}>${mdInline(tk[2],base)}</li>`:`<li>${mdInline(t,base)}</li>`}).join('')}</${ol?'ol':'ul'}>`;continue}
    if(!l.trim()){i++;continue}
    const buf=[];while(i<lines.length&&lines[i].trim()&&!/^(#{1,6}\s|```|>|\||\s*([-*]|\d+\.)\s|---)/.test(lines[i]))buf.push(lines[i++]);out+=`<p>${mdInline(buf.join(' '),base)}</p>`;
  }
  return out;
}

/* ---------- structure analysis on raw text ---------- */
const LEXCFG={cpp:{line:['//'],block:['/*','*/'],q:'"\''},py:{line:['#'],q:'"\'',tri:1},sh:{line:['#'],q:'"\''},ps1:{line:['#'],q:'"\''},yaml:{line:['#'],q:'"'},json:{q:'"'},ini:{line:['#',';'],q:'"'},
  sql:{line:['--'],block:['/*','*/'],q:'\''},docker:{line:['#'],q:'"'},make:{line:['#'],q:''},cmake:{line:['#'],q:'"'},hcl:{line:['#','//'],q:'"'},xml:{block:['<!--','-->'],q:'"'},md:{q:''},txt:{q:''}};
const INDENT_FOLD=new Set(['py','yaml','make']);
function analyze(src,lang){
  const L=src.split('\n'),cfg=LEXCFG[lang]||{q:'"'};const br=L.map(()=>[]),folds=new Map();const stack=[];
  const open='([{',close=')]}';let inBlock=false,str=null,tri=false;
  for(let li=0;li<L.length;li++){const s=L[li];let i=0;
    if(lang==='md'||lang==='txt')break;
    while(i<s.length){
      if(inBlock){const e=s.indexOf(cfg.block[1],i);if(e<0){i=s.length;break}i=e+cfg.block[1].length;inBlock=false;continue}
      if(tri){const e=s.indexOf('"""',i);if(e<0){i=s.length;break}i=e+3;tri=false;continue}
      if(str){if(s[i]==='\\'){i+=2;continue}if(s[i]===str){str=null}i++;continue}
      if(cfg.tri&&s.startsWith('"""',i)){tri=true;i+=3;continue}
      if(cfg.line&&cfg.line.some(t=>s.startsWith(t,i)))break;
      if(cfg.block&&s.startsWith(cfg.block[0],i)){inBlock=true;i+=cfg.block[0].length;continue}
      const ch=s[i];
      if(cfg.q.includes(ch)){str=ch;i++;continue}
      if(open.includes(ch)){const b={line:li,col:i,ch,depth:stack.length};stack.push(b);br[li].push(b)}
      else if(close.includes(ch)){const o=stack.length&&open.indexOf(stack[stack.length-1].ch)===close.indexOf(ch)?stack.pop():null;
        const b={line:li,col:i,ch,depth:o?o.depth:0,bad:!o};br[li].push(b);if(o){o.pair=b;b.pair=o;if(li>o.line&&!folds.has(o.line))folds.set(o.line,{end:li,kind:'br',close:s.trim()})}}
      i++}
    str=null;}
  stack.forEach(b=>b.bad=true);
  // indentation folding (python, yaml, makefile recipes)
  const indentOf=s=>{const m=s.match(/^[ \t]*/)[0];return m.replace(/\t/g,'    ').length};
  if(INDENT_FOLD.has(lang)){for(let i=0;i<L.length;i++){if(!L[i].trim()||folds.has(i))continue;const base=indentOf(L[i]);let end=i;
      for(let j=i+1;j<L.length;j++){if(!L[j].trim())continue;if(indentOf(L[j])>base)end=j;else break}

    heads.forEach(([i,lv],k)=>{let end=L.length-1;for(const [j,l2] of heads.slice(k+1))if(l2<=lv){end=j-1;break}while(end>i&&!L[end].trim())end--;if(end>i)folds.set(i,{end,kind:'ind'})})}

  return {L,br,folds,ind,tw};
}

/* ---------- symbols for the outline ---------- */
function symbolsOf(src,lang){const out=[];src.split('\n').forEach((s,i)=>{let m;
  if(lang==='cpp'){if(m=s.match(/^\s*(class|struct)\s+(\w+)/))out.push([m[2],m[1],i]);else if((m=s.match(/^\s*(?:[\w:<>,*&]+\s+)+?([\w:~]+)\s*\([^;]*\)\s*(?:const)?\s*\{?\s*$/))&&!/^\s*(if|for|while|switch|return)\b/.test(s))out.push([m[1],'function',i]);else if(m=s.match(/^\s*#define\s+(\w+)/))out.push([m[1],'macro',i])}
  else if(lang==='py'){if(m=s.match(/^\s*(def|class)\s+(\w+)/))out.push([m[2],m[1]==='def'?'function':'class',i])}
  else if(lang==='sh'){if(m=s.match(/^\s*(?:function\s+)?(\w+)\s*\(\)/))out.push([m[1],'function',i])}
  else if(lang==='ps1'){if(m=s.match(/^\s*(param|function)\s*(\w*)/i))out.push([m[2]||m[1],'function',i])}
  else if(lang==='yaml'){if(m=s.match(/^([\w./-]+):/))out.push([m[1],'key',i])}
  else if(lang==='json'){if(m=s.match(/^ {2}"([^"]+)"\s*:/))out.push([m[1],'key',i])}
  else if(lang==='make'){if((m=s.match(/^([\w.%-]+)\s*:(?!=)/))&&m[1]!=='.PHONY')out.push([m[1],'target',i])}
  else if(lang==='sql'){if(m=s.match(/CREATE\s+(TABLE|INDEX)\s+(\w+)/i))out.push([m[2],m[1].toLowerCase(),i])}
  else if(lang==='hcl'){if(m=s.match(/^(resource|variable|output|terraform|provider)\s*("[^"]+")?\s*("[^"]+")?/))out.push([(m[2]||'').replace(/"/g,'')+(m[3]?'.'+m[3].replace(/"/g,''):'')||m[1],m[1],i])}
  else if(lang==='md'){if(m=s.match(/^(#{1,6})\s+(.*)/))out.push(['  '.repeat(m[1].length-1)+m[2],'heading',i])}
  else if(lang==='docker'){if(m=s.match(/^FROM\s+(\S+)(?:\s+AS\s+(\w+))?/i))out.push([m[2]||m[1],'stage',i])}
  else if(lang==='cmake'){if(m=s.match(/^\s*add_(executable|library)\((\w+)/))out.push([m[2],m[1],i])}
  else if(lang==='ini'){if(m=s.match(/^\s*\[(.+)\]/))out.push([m[1],'section',i])}
});return out}

/* ---------- editor state & init ---------- */
const ED={path:null,an:null,folds:new Set(),cur:null,selA:null,selB:null,find:{q:'',i:0,matches:[],case:false,word:false,re:false},wrap:false};
state.edFolds=state.edFolds||{};
function initEditor(path){

    if(f){fg.innerHTML=`<button aria-label="Fold lines ${i+1} to ${f.end+1}" aria-expanded="true">${I('chev',12)}</button>`;fg.firstChild.onclick=e=>{e.stopPropagation();toggleFold(i)}}
    tr.querySelector('.ln').onclick=e=>lineClick(i,e);
  });
  root.onclick=e=>{const b=e.target.closest('.br');markPair(b);const tr=e.target.closest('tr[data-l]');if(tr&&!e.target.closest('.ln,.fg,.fold-ph'))setCursor(+tr.dataset.l-1,true);};

  const q=new URLSearchParams(location.hash.split('?')[1]||'');const Lq=q.get('L');
  if(Lq){const [a,b]=Lq.split('-').map(n=>+n-1);selectRange(a,isNaN(b)?a:b,false);revealLine(a);setTimeout(()=>rows[a]&&rows[a].scrollIntoView({block:'center'}),30)}

function decorateLine(cc,brs,indent){
  // wrap brackets (by character offset in the line's text) without touching strings/comments
  const want=new Map(brs.map(b=>[b.col,b]));let off=0;
  const walker=document.createTreeWalker(cc,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
  nodes.forEach(n=>{const t=n.nodeValue;const start=off;off+=t.length;const hits=[];for(let k=0;k<t.length;k++)if(want.has(start+k))hits.push(k);
    if(!hits.length)return;const frag=document.createDocumentFragment();let last=0;
    hits.forEach(k=>{if(k>last)frag.appendChild(document.createTextNode(t.slice(last,k)));const b=want.get(start+k);const sp=document.createElement('span');
      sp.className='br '+(b.bad?'bad':'d'+(b.depth%3));sp.textContent=t[k];sp.dataset.id=b.line+':'+b.col;if(b.pair)sp.dataset.p=b.pair.line+':'+b.pair.col;frag.appendChild(sp);last=k+1});
    if(last<t.length)frag.appendChild(document.createTextNode(t.slice(last)));n.parentNode.replaceChild(frag,n)});
  // indentation guides: wrap leading whitespace
  const first=cc.firstChild;const ws=first&&first.nodeType===3?first.nodeValue.match(/^[ \t]+/):null;

  if(ws){span.textContent=ws[0];first.nodeValue=first.nodeValue.slice(ws[0].length);cc.insertBefore(span,first)}
  else if(!cc.textContent.trim()&&indent>0){cc.textContent='';span.textContent=' '.repeat(indent);cc.appendChild(span)}
}
function markPair(b){document.querySelectorAll('.br.pair:not(.hov)').forEach(x=>x.classList.remove('pair'));if(!b||!b.dataset.p)return;b.classList.add('pair');const o=$('#codeEd').querySelector(`.br[data-id="${b.dataset.p}"]`);if(o){o.classList.add('pair');const ln=+b.dataset.p.split(':')[0];revealLine(ln)}}

/* ---------- folding ---------- */
function toggleFold(i,force){const f=ED.an.folds.get(i);if(!f)return;const on=force!=null?force:!ED.folds.has(i);on?ED.folds.add(i):ED.folds.delete(i);applyFolds();stickyUpdate()}
function applyFolds(){
  const {folds}=ED.an;const hidden=new Array(ED.rows.length).fill(false);
  ED.folds.forEach(s=>{const f=folds.get(s);if(!f)return;for(let k=s+1;k<=f.end;k++)hidden[k]=true});
  ED.rows.forEach((tr,i)=>{tr.classList.toggle('hid',hidden[i]);const cc=tr.querySelector('.cc');cc.querySelector(':scope > .fold-ph')?.remove();
    const btn=tr.querySelector('.fg button');if(btn){const c=ED.folds.has(i);btn.classList.toggle('closed',c);btn.setAttribute('aria-expanded',String(!c))}

      ph.textContent=f.kind==='br'?'⋯ '+(f.close.length>12?f.close.slice(0,12)+'…':f.close):`⋯ ${f.end-i} lines`;ph.onclick=e=>{e.stopPropagation();toggleFold(i,false)};cc.appendChild(ph)}});
  const st=$('#edFoldState');if(st)st.textContent=ED.folds.size?`${ED.folds.size} folded`:'';

function revealLine(ln){let changed=false;ED.folds.forEach(s=>{const f=ED.an.folds.get(s);if(f&&s<ln&&ln<=f.end){ED.folds.delete(s);changed=true}});if(changed)applyFolds()}
window.edFoldAll=on=>{if(!ED.an)return;if(on)ED.an.folds.forEach((f,s)=>ED.folds.add(s));else ED.folds.clear();applyFolds();stickyUpdate();toast(on?'Folded all regions':'Unfolded all','info')};

/* ---------- cursor, selection, line links ---------- */
function setCursor(i,fromClick){ED.cur=i;ED.rows.forEach((tr,k)=>tr.classList.toggle('cur',k===i));
  // active indent guide = innermost block containing the cursor
  document.querySelectorAll('#codeEd .ind.act').forEach(x=>x.classList.remove('act'));let best=null;ED.an.folds.forEach((f,s)=>{if(s<i&&i<=f.end&&(!best||s>best[0]))best=[s,f]});
  if(best){const lv=Math.floor(ED.an.ind[best[0]]/ED.an.tw);for(let k=best[0]+1;k<=best[1].end;k++){const ind=ED.rows[k].querySelector('.ind');if(ind&&ind.textContent.replace(/\t/g,'    ').length>lv*ED.an.tw){ind.classList.add('act');ind.style.setProperty('--al',lv*ED.an.tw)}}}

function lineClick(i,e){if(e.shiftKey&&ED.selA!=null)selectRange(ED.selA,i,true);else selectRange(i,i,true)}
function selectRange(a,b,copyLink){const lo=Math.min(a,b),hi=Math.max(a,b);ED.selA=a;ED.selB=b;ED.rows.forEach((tr,k)=>tr.classList.toggle('sel',k>=lo&&k<=hi));setCursor(b);
  const [h,q]=location.hash.split('?');const p=new URLSearchParams(q||'');p.set('L',lo===hi?String(lo+1):`${lo+1}-${hi+1}`);history.replaceState(null,'',h+'?'+p.toString());
  if(copyLink)copy(location.href,lo===hi?`Link to line ${lo+1}`:`Link to lines ${lo+1}–${hi+1}`);updateStatus()}

  let col=1;const s=window.getSelection();if(s&&s.anchorNode&&$('#codeEd')?.contains(s.anchorNode)){const cc=s.anchorNode.parentElement?.closest('.cc');if(cc){const r=document.createRange();r.selectNodeContents(cc);r.setEnd(s.anchorNode,s.anchorOffset);col=r.toString().length+1}}
  el.textContent=ED.cur==null?`${ED.rows.length} lines`:`Ln ${ED.cur+1}, Col ${col}${hi>lo&&lo>=0?`  (${hi-lo+1} lines selected)`:''}`}
window.edGoto=()=>dialog({title:'Go to line',body:`<div class="field"><label for="gl">Line number <span class="subtle">(1 to ${ED.rows.length})</span></label><input id="gl" class="input" type="number" min="1" max="${ED.rows.length}" onkeydown="if(event.key==='Enter')edGotoDo()"></div>`,actions:`<button class="btn ghost" onclick="closeDialog()">Cancel</button><button class="btn primary" onclick="edGotoDo()">Go</button>`});

window.jumpTo=jumpTo;

/* ---------- occurrences (CSS Custom Highlight API) ---------- */
const HL_OK=typeof CSS!=='undefined'&&CSS.highlights&&typeof Highlight!=='undefined';
function rangesFor(re){const out=[];if(!ED.rows)return out;
  ED.rows.forEach((tr,li)=>{if(tr.classList.contains('hid'))return;const cc=tr.querySelector('.cc');const nodes=[];const w=document.createTreeWalker(cc,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('.fold-ph')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});let t='';
    while(w.nextNode()){nodes.push([w.currentNode,t.length]);t+=w.currentNode.nodeValue}
    const at=pos=>{for(let k=nodes.length-1;k>=0;k--)if(nodes[k][1]<=pos)return [nodes[k][0],pos-nodes[k][1]];return [nodes[0][0],0]};
    re.lastIndex=0;let m;while((m=re.exec(t))){if(!m[0].length){re.lastIndex++;continue}const r=document.createRange();const [a,ao]=at(m.index),[b,bo]=at(m.index+m[0].length-1);r.setStart(a,ao);r.setEnd(b,bo+1);out.push({r,li})}});
  return out}
function occHighlight(word){if(!HL_OK)return;CSS.highlights.delete('occ');if(!word||word.length<2||!/^[\w$]+$/.test(word))return;CSS.highlights.set('occ',new Highlight(...rangesFor(new RegExp('\\b'+word.replace(/\$/g,'\\$')+'\\b','g')).map(x=>x.r)))}

function occFromSelection(){const w=String(window.getSelection()).trim();occHighlight(w)}

/* ---------- find in file ---------- */
function findRe(){const f=ED.find;if(!f.q)return null;let src=f.re?f.q:f.q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');if(f.word)src='\\b'+src+'\\b';try{return new RegExp(src,f.case?'g':'gi')}catch(e){return null}}
function runFind(move=0){const f=ED.find;if(!HL_OK){return}
  if(f.q&&findRe()){ // unfold everything that hides a match, then search visible text
    const re=findRe();ED.an.L.forEach((s,i)=>{re.lastIndex=0;if(re.test(s))revealLine(i)})}
  CSS.highlights.delete('find');CSS.highlights.delete('findcur');const re=findRe();f.matches=re?rangesFor(re):[];
  if(!f.matches.length){$('#edFindCnt').textContent=f.q?(re?'No results':'Bad pattern'):'';$('#edFindCnt').style.color=f.q?'var(--red)':'';return}
  f.i=((f.i+move)%f.matches.length+f.matches.length)%f.matches.length;
  CSS.highlights.set('find',new Highlight(...f.matches.map(m=>m.r)));CSS.highlights.set('findcur',new Highlight(f.matches[f.i].r));
  $('#edFindCnt').textContent=`${f.i+1} of ${f.matches.length}`;$('#edFindCnt').style.color='';
  const tr=ED.rows[f.matches[f.i].li];setCursor(f.matches[f.i].li);const pane=$('#viewerPane');const r=tr.getBoundingClientRect(),pr=pane.getBoundingClientRect();if(r.top<pr.top+140||r.bottom>pr.bottom-30)tr.scrollIntoView({block:'center'})}

window.edFindToggle=k=>{ED.find[k]=!ED.find[k];document.querySelector(`.ed-find .tg[data-k="${k}"]`).classList.toggle('on',ED.find[k]);ED.find.i=0;runFind()};

/* ---------- sticky scroll ---------- */
function stickyUpdate(){const box=$('#edSticky');const pane=$('#viewerPane');if(!box||!pane||!ED.an)return;
  const head=pane.querySelector('.sticky-h');const base=pane.getBoundingClientRect().top+(head?head.offsetHeight-(box.classList.contains('on')?box.offsetHeight:0):0);const lh=21.45;
  const firstBelow=y=>{for(let i=0;i<ED.rows.length;i++){const tr=ED.rows[i];if(tr.classList.contains('hid'))continue;if(tr.getBoundingClientRect().bottom>y+2)return i}return -1};
  const scopesAt=f=>{const sc=[];if(f>0)ED.an.folds.forEach((x,s)=>{if(s<f&&f<=x.end&&!ED.folds.has(s))sc.push(s)});return sc.sort((a,b)=>a-b).slice(-4)};

/* ---------- keyboard ---------- */

function render(){
  closeMenu();hcHide(true);
  const [path,qs]=(location.hash.slice(2)||'').split('?');
  const seg=path.split('/').filter(Boolean);const query=new URLSearchParams(qs||'');
  if(state.anon&&!['explore','r','docs','welcome','login','register','verify','forgot','u','suspended','error',undefined].includes(seg[0])){location.hash='#/login?next='+encodeURIComponent(path);return}
  renderTop(seg);renderSide(seg);$('#side').classList.remove('open');
  let p;
  switch(seg[0]){
    case undefined:p=state.anon?pageExplore(query):pageHome();break;
    case 'explore':p=pageExplore(query);break;
    case 'register':p=pageRegister();break;
    case 'verify':p=pageVerify();break;
    case 'forgot':p=pageForgot(query);break;
    case 'suspended':p=pageSuspended();break;
    case 'orgs':p=pageOrgNew();break;
    case 'u':p=pageProfile(seg[1]||'brxj19');break;
    case 'admin':p=pageAdmin(seg[1]);break;
    case 'map':p=pageMap();break;
    case 'error':p=pageError(seg[1]||'500');break;
    case 'repos':p=pageRepos();break;
    case 'r':{const r=findRepo(seg[1]);const t=seg[2]||'';
      if(!r){p=state.anon?pageNoAccess({org:'sigma',slug:seg[1]}):pageNotFound();break}
      if(!canSee(r)&&!(r.noaccess&&state.breakglass&&!state.anon)){p=pageNoAccess(r);break}
      if(r.noaccess){p=guardRepo({...r,state:'ready',slug:'payments-core'},'')||pageRepoOverview(r);break}
      if(t==='pulls'){p=seg[3]==='new'?pageNewPull(r):seg[3]?pageRepoPull(r,seg[3],seg[4]):pageRepoPulls(r,query);break}
      if(t==='code')p=pageCode(r,decodeURIComponent(seg.slice(3).join('/')),query);
      else if(t==='history')p=pageHistory(r,query);
      else if(t==='c')p=pageChangeset(r,seg[3]);
      else if(t==='refs')p=pageRefs(r,seg[3]||'branches');
      else if(t==='settings')p=pageRepoSettings(r,seg[3]);
      else p=pageRepoOverview(r);break}
    case 'org':p=pageOrg(seg[1]);break;
    case 'settings':p=pageUser(seg[1]);break;
    case 'activity':p=pageActivity();break;
    case 'reviews':p=pageReviews();break;
    case 'new':p=pageNew();break;
    case 'login':p=pageLogin(query);break;
    case 'welcome':p=pageLanding();break;
    case 'docs':p=pageDocs(seg,query);break;
    case 'ui':p=pageKit();break;
    case 'illustrations':p=pageIllustrations();break;
    default:p=pageNotFound();
  }
  const app=$('#app'),m=$('#main');
  if(state.breakglass&&!p.bare){p.html=`<div class="bg-banner">${I('shield',15)}<span><b>Break-glass session</b> on acme-labs/payments-core. Read-only, logged, ends in 59 minutes.</span><button class="btn sm danger-solid" style="margin-left:auto" onclick="state.breakglass=false;go('#/admin')">End session</button></div>`+p.html;p.ws=p.ws;}
  app.style.gridTemplateColumns=p.bare||state.anon?'minmax(0,1fr)':'';$('#side').style.display=p.bare||state.anon?'none':'';$('.top').style.display=p.bare?'none':'';
  app.style.gridTemplateRows=p.bare?'minmax(0,1fr)':'';
  // keep pane scroll positions when re-rendering the same route
  const same=m.dataset.path===path;const saved=same?[...m.querySelectorAll('.pane')].map(x=>x.scrollTop):[];const mst=m.scrollTop;
  m.className='main'+(p.ws?' ws':'');m.innerHTML=p.html;m.dataset.path=path;
  if(same){m.querySelectorAll('.pane').forEach((x,i)=>{if(saved[i]!=null)x.scrollTop=saved[i]});m.scrollTop=mst}else m.scrollTop=0;
  p.after&&p.after();
  wire();wireHeat();heatPin=-1;
}

}

function palSource(mode,term){
  const out=[];const add=(group,items)=>items.forEach(it=>{const f=fuzzy(it.label+(it.alt?' '+it.alt:''),term);if(f.ok)out.push({...it,group,score:f.score,lh:fuzzy(it.label,term).html})});
  const want=m=>mode==='default'||mode===m;
  if(want('actions'))add('Actions',ACTIONS.map(a=>({...a,kind:'action'})));
  if(want('projects'))add('Projects',[...repos.map(r=>({id:'p:'+r.slug,label:r.slug,detail:r.desc,ic:'repo',kind:'repo',r,run:()=>go('#/r/'+r.slug)})),...orgs.map(o=>({id:'o:'+o.slug,label:o.name,detail:o.repos+' repositories, organization',ic:'org',kind:'org',o,run:()=>go('#/org')}))]);
  if(want('people'))add('People',members.map(m=>({id:'u:'+m.name,label:m.name,alt:m.email,detail:m.email+', '+m.role,ic:'user',kind:'person',m,run:()=>go('#/org/members')})));
  if(want('files'))add('Files',Object.keys(files).map(p=>({id:'f:'+p,label:p.split('/').pop(),alt:p,detail:p,fi:p,kind:'file',path:p,run:()=>go('#/r/sigma-reckitt/code/'+p)})));
  if(want('revisions')){add('Changesets',cs.map(c=>({id:'r:'+c.n,label:c.m,alt:c.n+' '+c.b,detail:short(c.n)+'  '+c.b,ic:'commit',kind:'cs',c,run:()=>go('#/r/sigma-reckitt/c/'+c.n)})));
    add('Branches and tags',[...refs.branches.map(b=>({id:'b:'+b.name,label:b.name,detail:'branch, '+b.state,ic:'branch',kind:'ref',node:b.node,run:()=>{state.histBranch=b.name;go('#/r/sigma-reckitt/history')}})),...refs.tags.map(t=>({id:'t:'+t.name,label:t.name,detail:'tag',ic:'tag',kind:'ref',node:t.node,run:()=>go('#/r/sigma-reckitt/c/'+t.node)}))]);}
  if(mode==='search'&&term){Object.entries(source).forEach(([p,src])=>src.split('\n').forEach((line,i)=>{const at=line.toLowerCase().indexOf(term.toLowerCase());if(at>=0)out.push({id:'s:'+p+i,group:'Matches in sigma-reckitt',label:line.trim(),lh:esc(line.trim()).replace(new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i'),m=>'<mark>'+m+'</mark>'),detail:p+':'+(i+1),fi:p,kind:'match',path:p,line:i+1,run:()=>go('#/r/sigma-reckitt/code/'+p)})}))}
  if(mode==='default'&&!term)return null;
  if(term&&mode==='default')out.sort((a,b)=>b.score-a.score);
  return out;
}

  el.innerHTML=h;
}
function runPal(i){const c=palItems[i];if(!c)return;closePalette();recentIds.unshift(c.id);c.run()}
$('#palInput').oninput=()=>{const before=palMode;applyPrefix();if(before!==palMode){}palSel=0;drawPal()};
$('#palInput').onkeydown=e=>{const i=$('#palInput');
  if(e.key==='ArrowDown'){e.preventDefault();palSel=Math.min(palSel+1,palItems.length-1);markPal()}
  else if(e.key==='ArrowUp'){e.preventDefault();palSel=Math.max(palSel-1,0);markPal()}
  else if(e.key==='Enter'){e.preventDefault();runPal(palSel)}
  else if(e.key==='Escape'){e.preventDefault();closePalette()}
  else if(e.key==='Tab'){e.preventDefault();const ids=['default',...MODES.map(m=>m.id)];setMode(ids[(ids.indexOf(palMode)+(e.shiftKey?ids.length-1:1))%ids.length])}
  else if(e.key==='Backspace'&&!i.value&&palMode!=='default'){e.preventDefault();setMode('default')}};
$('#palette').onclick=e=>{if(e.target.id==='palette')closePalette()};
$('#searchBtn').onclick=()=>openPalette('');

/* global keys */
let chord='';let chordT;
document.addEventListener('keydown',e=>{
  const typing=/input|textarea|select/i.test(document.activeElement.tagName);
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#palette').classList.contains('open')?closePalette():openPalette('');return}
  if(e.key==='Escape'){hcHide(true);closePalette();closeDialog();closeMenu(true);return}
  if(typing||$('#palette').classList.contains('open')||$('#dlg').classList.contains('open'))return;
  if(e.key==='/'){e.preventDefault();openPalette('');return}
  if(e.key==='?'){e.preventDefault();dialogs.shortcuts();return}
  if(e.key==='t'&&location.hash.includes('/r/')){e.preventDefault();openPalette('~');return}
  if(e.key==='b'&&/\/code\/.+\.\w+/.test(location.hash)){e.preventDefault();const [h,q]=location.hash.split('?');go(q&&q.includes('view=blame')?h:h+'?view=blame');return}
  const k=e.key.toLowerCase();
  if(chord==='g'){chord='';const to={h:'#/',r:'#/repos',a:'#/activity',c:'#/r/sigma-reckitt/code'}[k];if(to)go(to);return}
  if(k==='g'){chord='g';clearTimeout(chordT);chordT=setTimeout(()=>chord='',900)}
});

render();
</script>
