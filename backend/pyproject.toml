[project]
name = "revforge-backend"
version = "0.1.0"
description = "FastAPI control plane for RevForge."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16.4,<2.0.0",
  "asyncpg>=0.30.0,<0.31.0",
  "fastapi>=0.116.1,<0.117.0",
  "greenlet>=3.2.3,<4.0.0",
  "pydantic-settings>=2.10.1,<3.0.0",
  "sqlalchemy>=2.0.41,<3.0.0",
  "structlog>=25.4.0,<26.0.0",
  "uvicorn[standard]>=0.35.0,<0.36.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1,<0.29.0",
  "mypy>=1.17.0,<2.0.0",
  "pytest>=8.4.1,<9.0.0",
  "pytest-asyncio>=1.1.0,<2.0.0",
  "ruff>=0.12.2,<0.13.0",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
ignore_missing_imports = false
plugins = []

